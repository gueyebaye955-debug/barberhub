<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/assets/logoo.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <script>if (/\/barber\/\d+/.test(location.pathname)) document.write('<base href="/">');</script>
  <title>Provider Profile | JOTMA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'></text></svg>">
  <link rel="stylesheet" href="assets/css/style.css?v=27">
  <style>
    .master-sticky-wrap {
      position: sticky;
      top: 66px;
      z-index: 30;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(6px);
    }
    .master-topbar {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 0;
    }
    .master-title {
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .master-actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .master-icon-btn {
      width: 40px;
      height: 40px;
      min-width: 40px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .master-icon-btn:hover { background: var(--bg-elevated); border-color: var(--primary); }
    .master-icon-btn.is-fav {
      color: var(--primary);
      border-color: rgba(233, 69, 96, 0.4);
      background: rgba(233, 69, 96, 0.08);
    }
    .master-tabs {
      display: flex;
      gap: 0.3rem;
      overflow-x: auto;
      padding-bottom: 0.2rem;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .master-tabs::-webkit-scrollbar { display: none; }
    .master-tab-btn {
      min-height: 44px;
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-bottom: 2px solid transparent;
      padding: 0.65rem 0.55rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .master-tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .profile-tabs-wrap {
      border-bottom: 1px solid var(--border);
      margin: 0.25rem 0 0.85rem;
      padding: 0 0.2rem;
    }
    .profile-wrap { padding: 1rem 0 3rem; }
    .profile-summary {
      padding: 1.25rem;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 1rem;
      align-items: start;
      margin-bottom: 1.1rem;
    }
    .profile-ava {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      border: 3px solid var(--primary);
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 800;
      color: white;
      overflow: hidden;
      flex-shrink: 0;
    }
    .profile-ava img { width: 100%; height: 100%; object-fit: cover; }
    .profile-name {
      font-size: clamp(1.1rem, 3.4vw, 1.45rem);
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
      margin-bottom: 0.2rem;
    }
    .profile-sub  { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.55rem; }
    .profile-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
    }
    .profile-bio {
      color: var(--text-muted);
      line-height: 1.65;
      max-width: 560px;
      font-size: 0.86rem;
      margin-top: 0.45rem;
    }
    .profile-cta { min-width: 175px; }
    .review-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem;
    }
    .review-head {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.6rem;
    }
    .review-ava {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--bg-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--primary);
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .portfolio-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 0.75rem; }
    .rating-bar-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.4rem; font-size: 0.82rem; }
    .rating-bar-track { flex: 1; height: 6px; background: var(--bg-elevated); border-radius: 3px; overflow: hidden; }
    .rating-bar-fill  { height: 100%; background: var(--gold); border-radius: 3px; }
    .rating-bar-label { min-width: 24px; color: var(--text-muted); }
    .reviews-summary { display: grid; grid-template-columns: auto 1fr; gap: 2rem; align-items: center; margin-bottom: 1.75rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; }
    .hours-list {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .hours-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0.95rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.86rem;
    }
    .hours-row:last-child { border-bottom: none; }
    .hours-row.closed { opacity: 0.5; }

    .services-accordion { display: flex; flex-direction: column; gap: 0.9rem; }
    .service-group {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .service-group-toggle {
      width: 100%;
      min-height: 50px;
      border: none;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      padding: 0.65rem 0.95rem;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .service-group-body { padding: 0 0.95rem 0.95rem; }
    .service-group.collapsed .service-group-body { display: none; }
    .service-group.collapsed .service-group-toggle { border-bottom: none; }
    .service-arrow {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 800;
      flex-shrink: 0;
    }
    .svc-item {
      padding: 1rem;
      margin-top: 0.8rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-surface);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .svc-head {
      display: flex;
      justify-content: space-between;
      gap: 0.9rem;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .svc-name {
      font-size: 0.96rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
    }
    .svc-desc { color: var(--text-muted); font-size: 0.83rem; line-height: 1.55; }
    .svc-meta { color: var(--text-muted); font-size: 0.77rem; margin-top: 0.35rem; display: block; }
    .svc-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.45rem;
      min-width: 130px;
    }
    .svc-price { font-size: 1.08rem; font-weight: 800; color: var(--primary); }
    .svc-discount {
      font-size: 0.68rem;
      font-weight: 700;
      color: #9a3412;
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(245, 158, 11, 0.45);
      border-radius: 999px;
      padding: 0.16rem 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .svc-preview-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.55rem;
    }
    .svc-preview-grid img {
      width: 100%;
      aspect-ratio: 1;
      border-radius: var(--radius-sm);
      object-fit: cover;
      border: 1px solid var(--border);
    }

    @media (max-width: 768px) {
      .master-sticky-wrap { top: 61px; }
      .master-topbar { gap: 0.55rem; }
      .master-title { font-size: 0.92rem; }
      .profile-summary { grid-template-columns: 1fr; text-align: center; }
      .profile-meta { justify-content: center; }
      .profile-cta  { width: 100%; }
      .svc-right { width: 100%; align-items: flex-start; min-width: 0; }
      .svc-head { flex-direction: column; gap: 0.7rem; }
      .svc-preview-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .portfolio-grid { grid-template-columns: repeat(2,1fr); }
      .reviews-summary { grid-template-columns: 1fr; gap: 1rem; }
    }
  </style>
</head>
<body class="page-wrap">
  <nav class="navbar" id="navbar"></nav>

  <main id="main">
    <div class="loading-box" style="padding:5rem"><div class="spinner"></div><p>Loading profile...</p></div>
  </main>

  <footer class="footer" id="footer"></footer>

  <!-- Review Modal -->
  <div class="modal-overlay" id="reviewModal">
    <div class="modal">
      <h3 data-i18n="write_review"> Write a Review</h3>
      <p class="sub">Rate your experience</p>
      <div class="form-group">
        <label class="form-label">Rating</label>
        <div id="starPicker" style="display:flex;gap:6px;font-size:1.8rem;cursor:pointer">
          <span data-v="1"></span><span data-v="2"></span><span data-v="3"></span><span data-v="4"></span><span data-v="5"></span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Comment (optional)</label>
        <textarea class="form-control" id="reviewComment" placeholder="Share your experience..." rows="3"></textarea>
      </div>
      <div id="reviewAlert"></div>
      <div style="display:flex;gap:0.75rem;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="closeReviewModal()" data-i18n="btn_cancel">Cancel</button>
        <button class="btn btn-primary" onclick="submitReview()">Submit Review</button>
      </div>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox-overlay" id="lightbox" onclick="lightboxBgClick(event)">
    <button class="lightbox-close" onclick="closeLightbox()"></button>
    <button class="lightbox-nav lightbox-prev" onclick="lightboxNav(-1)"></button>
    <img class="lightbox-img" id="lightboxImg" src="" alt="">
    <button class="lightbox-nav lightbox-next" onclick="lightboxNav(1)"></button>
    <div class="lightbox-caption" id="lightboxCaption"></div>
    <div class="lightbox-counter" id="lightboxCounter"></div>
  </div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/nav.js?v=24"></script>
  <script>
    window.__currentNavPage = 'profile';
    renderNav('profile');
    renderFooter();
    applyI18n();

    const params = new URLSearchParams(location.search);
    const user = Auth.getUser();
    let barber = null;

    let currentTab = 'services';
    let reviewRating = 5;
    let serviceSectionState = { popular: true, other: true };

    // Lightbox state
    let lbPhotos = [];
    let lbIndex = 0;

    function resolveBarberId() {
      const fromQuery = parseInt(params.get('id'), 10);
      if (Number.isInteger(fromQuery) && fromQuery > 0) return fromQuery;
      const match = location.pathname.match(/\/barber\/(\d+)\/?$/);
      if (match) {
        const fromPath = parseInt(match[1], 10);
        if (Number.isInteger(fromPath) && fromPath > 0) return fromPath;
      }
      return null;
    }

    const barberId = resolveBarberId();

    function getBarberPublicUrl(id) {
      const safeId = parseInt(id, 10);
      const fallback = `profile.html?id=${encodeURIComponent(id)}`;
      if (!Number.isInteger(safeId) || safeId <= 0) return fallback;
      if (location.protocol === 'file:') return fallback;
      return `${location.origin}/barber/${safeId}`;
    }

    function getBookUrl(id, serviceId) {
      const query = new URLSearchParams();
      query.set('barber', String(id));
      if (Number.isInteger(parseInt(serviceId, 10))) query.set('service', String(serviceId));
      return `book.html?${query.toString()}`;
    }

    function getLoginRedirectUrl(target) {
      const safeTarget = String(target || '').replace(/^\//, '');
      return `login.html?redirect=${encodeURIComponent(safeTarget)}`;
    }

    function getServiceImageList(service) {
      // Single image_url from Cloudinary
      if (service?.image_url && typeof service.image_url === 'string') {
        return [service.image_url.trim()].filter(Boolean);
      }
      const direct = [
        ...(Array.isArray(service?.gallery) ? service.gallery : []),
        ...(Array.isArray(service?.images) ? service.images : []),
        ...(Array.isArray(service?.preview_images) ? service.preview_images : []),
      ]
        .map((img) => (typeof img === 'string' ? img.trim() : ''))
        .filter(Boolean);
      if (direct.length) return direct.slice(0, 3);

      const portfolioFallback = (Array.isArray(barber?.portfolio) ? barber.portfolio : [])
        .map((p) => (typeof p?.url === 'string' ? p.url.trim() : ''))
        .filter(Boolean);
      return portfolioFallback.slice(0, 3);
    }

    function getServiceGroups(services) {
      const list = Array.isArray(services) ? services.slice() : [];
      if (!list.length) return [];

      let popular = list.filter((svc) => {
        const category = String(svc?.category || '').toLowerCase();
        return Boolean(svc?.popular || svc?.is_popular || category === 'popular services' || category === 'popular');
      });
      if (!popular.length) {
        popular = list.slice(0, Math.min(3, list.length));
      }

      const popularIds = new Set(popular.map((svc, idx) => String(svc?.id ?? `popular-${idx}`)));
      const other = list.filter((svc, idx) => !popularIds.has(String(svc?.id ?? `popular-${idx}`)));

      const groups = [];
      if (popular.length) groups.push({ key: 'popular', title: t('services_popular'), items: popular });
      if (other.length) groups.push({ key: 'other', title: t('services_other'), items: other });
      return groups;
    }

    function goBackToResults() {
      try {
        if (document.referrer) {
          const ref = new URL(document.referrer);
          if (ref.origin === location.origin) {
            history.back();
            return;
          }
        }
      } catch (_) {}
      location.href = 'barbers.html';
    }

    async function shareCurrentBarber() {
      if (!barber) return;
      const shareUrl = getBarberPublicUrl(barber.id);
      const title = barber.shop_name || `${barber.first_name} ${barber.last_name}`;
      if (navigator.share) {
        try {
          await navigator.share({ title, text: title, url: shareUrl });
          return;
        } catch (_) {}
      }
      if (navigator.clipboard?.writeText) {
        try {
          await navigator.clipboard.writeText(shareUrl);
          alert(t('profile_link_copied'));
          return;
        } catch (_) {}
      }
      window.prompt(t('copy_profile_link_prompt'), shareUrl);
    }

    (async function initProfilePage() {
      if (!barberId) {
        document.getElementById('main').innerHTML = `<div class="empty-state" style="padding:6rem"><div class="icon"></div><h3>${t('profile_invalid_link')}</h3><a href="barbers.html" class="btn btn-primary mt-2">${t('browse_barbers_btn')}</a></div>`;
        return;
      }

      // Safety net — never show spinner for more than 10 seconds
      const loadingGuard = setTimeout(() => {
        const main = document.getElementById('main');
        if (main && main.querySelector('.spinner')) {
          main.innerHTML = `<div class="empty-state" style="padding:6rem"><div class="icon">⚠️</div><h3>Took too long to load</h3><p style="color:var(--text-muted)">Check your connection and try again.</p><a href="barbers.html" class="btn btn-primary mt-2">${t('browse_barbers_btn')}</a></div>`;
        }
      }, 10000);

      barber = getBarber(barberId);
      if (barber) {
        try {
          renderProfile();
        } catch (err) {
          console.error('Initial profile render failed:', err);
        }
      }

      const [apiBarber] = await Promise.all([
        loadApiBarberById(barberId),
        (async () => {
          if (user && window.BH_API) {
            try {
              const favRows = await window.BH_API.getFavorites();
              const favoriteIds = Array.isArray(favRows) ? favRows.map((f) => parseInt(f.id, 10)).filter(Number.isFinite) : [];
              const allFavs = JSON.parse(localStorage.getItem('bh_favorites') || '{}');
              allFavs[user.id] = favoriteIds;
              localStorage.setItem('bh_favorites', JSON.stringify(allFavs));
            } catch (err) {
              console.warn('Unable to sync favorites:', err.message);
            }
          }
        })(),
      ]);

      clearTimeout(loadingGuard);
      barber = apiBarber || barber;
      if (!barber) {
        document.getElementById('main').innerHTML = `<div class="empty-state" style="padding:6rem"><div class="icon"></div><h3>Barber not found</h3><a href="barbers.html" class="btn btn-primary mt-2">${t('browse_barbers_btn')}</a></div>`;
        return;
      }

      document.title = `${barber.shop_name || barber.first_name + ' ' + barber.last_name} | JOTMA`;
      if (typeof Analytics !== 'undefined') Analytics.track('profile_view', { barber_id: barber.id, city: barber.city });
      try {
        renderProfile();
      } catch (err) {
        console.error('Profile render failed:', err);
        document.getElementById('main').innerHTML = `<div class="empty-state" style="padding:6rem"><div class="icon"></div><h3>Unable to load this provider profile</h3><a href="barbers.html" class="btn btn-primary mt-2">${t('browse_barbers_btn')}</a></div>`;
        return;
      }

      if (params.get('review') === '1') {
        setTimeout(() => {
          const reviewsBtn = document.querySelector('.master-tab-btn[data-tab="reviews"]');
          switchTab('reviews', reviewsBtn);
          openReviewModal();
        }, 280);
      }
    }());

    function renderProfile() {
      const isFav = user ? Favorites.isFav(user.id, barber.id) : false;
      const services = getBarberServices(barber);
      const minPrice = getBarberMinPrice(barber);
      const initials = getNameInitials(barber?.first_name, barber?.last_name);
      const isCustomer = user && user.role === 'customer';
      const ratingValue = Number.isFinite(Number(barber?.rating)) ? Number(barber.rating) : 0;
      const totalReviews = Number.isFinite(Number(barber?.total_reviews)) ? Number(barber.total_reviews) : 0;
      const portfolio = Array.isArray(barber.portfolio) ? barber.portfolio : [];
      const bookingUrl = getBookUrl(barber.id);
      const bookCta = isCustomer
        ? (services.length
          ? `<a href="${bookingUrl}" class="btn btn-primary btn-lg btn-block">${t('profile_book_btn')}</a>`
          : `<button class="btn btn-ghost btn-lg btn-block" disabled>${t('no_services_listed')}</button>`)
        : `<a href="${getLoginRedirectUrl(bookingUrl)}" class="btn btn-primary btn-lg btn-block">${t('profile_login_book')}</a>`;
      const minPriceLabel = minPrice === null ? 'Pricing available on profile' : `${t('profile_from')} ${fmtPrice(minPrice)}`;

      document.getElementById('main').innerHTML = `
        <div class="master-sticky-wrap">
          <div class="container master-topbar">
            <button class="master-icon-btn" onclick="goBackToResults()" aria-label="Back">&#8592;</button>
            <div class="master-title">${escapeHTML(barber.shop_name || `${barber.first_name} ${barber.last_name}`)}</div>
            <div class="master-actions">
              <button class="master-icon-btn" onclick="shareCurrentBarber()" aria-label="Share">&#8599;</button>
              <button class="master-icon-btn ${isFav ? 'is-fav' : ''}" onclick="toggleFav()" aria-label="Favorite">${isFav ? '&#9829;' : '&#9825;'}</button>
            </div>
          </div>
        </div>

        <div class="container profile-wrap">
          <div class="profile-summary card fade-in">
            <div class="profile-ava">${getBarberAvatar(barber) ? `<img src="${getBarberAvatar(barber)}" alt="${escapeHTML(barber.first_name)}">` : initials}</div>
            <div>
              <div class="profile-name">
                ${escapeHTML(barber.shop_name || `${barber.first_name} ${barber.last_name}`)}
                ${barber.is_verified ? '<span class="verified-check" title="Verified"></span>' : ''}
              </div>
              <div class="profile-sub">by ${escapeHTML(barber.first_name)} ${escapeHTML(barber.last_name)}</div>
              <div class="profile-meta">
                <span>${escapeHTML(barber.location || barber.city || '')}</span>
                ${barber.years_experience ? `<span>${barber.years_experience} ${t('profile_exp')}</span>` : ''}
                <span>${barber.total_bookings} ${t('profile_bookings')}</span>
              </div>
              <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap">
                ${starsHTML(ratingValue, '1.02rem')}
                <strong>${ratingValue.toFixed(1)}</strong>
                <span class="text-muted text-sm">(${totalReviews} ${t('reviews_count')})</span>
                ${barber.booked_today > 0 ? `<span style="background:rgba(233,69,96,0.1);color:var(--primary);font-size:0.72rem;padding:0.15rem 0.5rem;border-radius:50px;font-weight:700">${barber.booked_today} ${t('card_booked_today')}</span>` : ''}
              </div>
              ${barber.bio ? `<div class="profile-bio">${escapeHTML(barber.bio)}</div>` : ''}
            </div>
            <div class="profile-cta">
              ${bookCta}
              ${isCustomer && barber.user_id ? `<a href="dashboard.html?msg=${barber.user_id}" class="btn btn-ghost btn-sm btn-block" style="margin-top:0.35rem">${t('msg_barber_btn')}</a>` : ''}
              <a href="${getGoogleBusinessLink(barber)}" target="_blank" rel="noopener" class="btn btn-ghost btn-sm btn-block" style="margin-top:0.5rem">${t('view_google_btn')}</a>
              <p class="text-muted text-sm text-center mt-1">${minPriceLabel}</p>
            </div>
          </div>

          <div class="profile-tabs-wrap">
            <div class="master-tabs">
              <button class="master-tab-btn active" data-tab="services" onclick="switchTab('services', this)">${(t('tab_services') || 'Services').trim().toUpperCase()}</button>
              <button class="master-tab-btn" data-tab="gallery" onclick="switchTab('gallery', this)">${(typeof t === 'function' ? t('sheet_tab_gallery') : 'Gallery').trim().toUpperCase()}</button>
              <button class="master-tab-btn" data-tab="reviews" onclick="switchTab('reviews', this)">${(t('tab_reviews') || 'Avis').trim().toUpperCase()}</button>
              <button class="master-tab-btn" data-tab="availability" onclick="switchTab('availability', this)">${(typeof t === 'function' ? t('sheet_tab_schedule') : 'Horaires').trim().toUpperCase()}</button>
            </div>
          </div>

          <div id="tabContent" style="padding-bottom:3rem"></div>
        </div>`;

      switchTab(currentTab || 'services');
    }

    function openPortfolioTab() {
      const btn = document.querySelector('.master-tab-btn[data-tab="gallery"]');
      if (!btn) return;
      switchTab('gallery', btn);
      document.getElementById('tabContent')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function switchTab(tab, btn) {
      currentTab = tab;
      document.querySelectorAll('.master-tab-btn').forEach((tabBtn) => tabBtn.classList.remove('active'));
      const targetBtn = btn || document.querySelector(`.master-tab-btn[data-tab="${tab}"]`);
      if (targetBtn) targetBtn.classList.add('active');
      renderTab(tab);
    }

    function toggleServiceGroup(groupKey) {
      serviceSectionState[groupKey] = !serviceSectionState[groupKey];
      renderTab('services');
    }

    function renderTab(tab) {
      const isCustomer = user && user.role === 'customer';
      const isBarber = user && user.role === 'barber' && user.barber_id === barber.id;
      const el = document.getElementById('tabContent');
      const servicesList = getBarberServices(barber);
      const reviewsBase = Array.isArray(barber.reviews) ? barber.reviews : [];
      const portfolio = Array.isArray(barber.portfolio) ? barber.portfolio : [];
      const availability = Array.isArray(barber.availability) ? barber.availability : [];

      if (tab === 'services') {
        if (!servicesList.length) {
          el.innerHTML = `<div class="empty-state fade-in"><div class="icon"></div><p>${t('no_services_listed')}</p></div>`;
          return;
        }

        const groups = getServiceGroups(servicesList);
        const groupsHtml = groups.map((group) => {
          const isOpen = serviceSectionState[group.key] !== false;
          const itemsHtml = group.items.map((service, idx) => {
            const durationNum = Number(service?.duration);
            const durationLabel = Number.isFinite(durationNum) && durationNum > 0 ? `${durationNum}m` : '30m';
            const priceLabel = fmtPrice(service?.price);
            const serviceDesc = String(service?.desc || service?.description || '').trim();
            const serviceImages = getServiceImageList(service);
            return `
              <div class="svc-item">
                <div class="svc-head">
                  <div>
                    <div class="svc-name">${escapeHTML(service?.name || `Service ${idx + 1}`)}</div>
                    ${serviceDesc ? `<div class="svc-desc">${escapeHTML(serviceDesc)}</div>` : ''}
                    <span class="svc-meta">${durationLabel}</span>
                  </div>
                  <div class="svc-right">
                    <span class="svc-price">${priceLabel}</span>
                    <a href="book.html?barber=${barber.id}&service=${service.id}" class="btn btn-primary btn-sm">${t('card_book_now')}</a>
                  </div>
                </div>
                ${serviceImages.length ? `
                  <div class="svc-preview-grid">
                    ${serviceImages.map((src, imageIdx) => `<img src="${escapeHTML(src)}" alt="${escapeHTML(service?.name || 'Service photo')} ${imageIdx + 1}" loading="lazy">`).join('')}
                  </div>` : ''}
              </div>`;
          }).join('');

          return `
            <div class="service-group ${isOpen ? '' : 'collapsed'}">
              <button class="service-group-toggle" onclick="toggleServiceGroup('${group.key}')">
                <span>${escapeHTML(group.title)} (${group.items.length})</span>
                <span class="service-arrow">${isOpen ? '&#9662;' : '&#9656;'}</span>
              </button>
              <div class="service-group-body">${itemsHtml}</div>
            </div>`;
        }).join('');

        el.innerHTML = `<div class="services-accordion fade-in">${groupsHtml}</div>`;
        return;
      }

      if (tab === 'gallery') {
        if (!portfolio.length) {
          el.innerHTML = `<div class="empty-state fade-in"><div class="icon"></div><p>${t('no_portfolio')}</p></div>`;
        } else {
          lbPhotos = portfolio;
          el.innerHTML = `
            <div class="fade-in">
              <p class="text-muted text-sm" style="margin-bottom:1rem">${t('click_to_view')}</p>
              <div class="portfolio-grid">
                ${portfolio.map((p, i) => `
                  <img class="portfolio-thumb" src="${p.url}" alt="${p.caption}" loading="lazy" onclick="openLightbox(${i})" title="${p.caption}">`
                ).join('')}
              </div>
            </div>`;
        }
        return;
      }

      if (tab === 'availability') {
        if (!availability.length) {
          el.innerHTML = `<div class="empty-state fade-in"><div class="icon"></div><p>${typeof t === 'function' ? t('sheet_no_schedule') : 'Horaires non definis.'}</p></div>`;
          return;
        }
        el.innerHTML = `
          <div class="fade-in">
            <div class="hours-list">
              ${availability.map((slot) => `
                <div class="hours-row ${!slot.open ? 'closed' : ''}">
                  <span style="font-weight:600;min-width:98px">${escapeHTML(slot.label)}</span>
                  <span style="color:var(--text-muted)">${slot.open ? `${slot.start} - ${slot.end}` : 'Closed'}</span>
                </div>`).join('')}
            </div>
          </div>`;
        return;
      }

      if (tab === 'reviews') {
        const userReviews = Reviews.get(barber.id);
        const allReviews  = [...reviewsBase, ...userReviews];
        const avg = allReviews.reduce((s,r) => s + r.rating, 0) / (allReviews.length || 1);
        const counts = [5,4,3,2,1].map(n => ({
          n, cnt: allReviews.filter(r => r.rating === n).length
        }));

        const reviewHTML = allReviews.map(r => {
          const replyKey  = `bh_reply_${barber.id}_${r.id}`;
          const savedReply = localStorage.getItem(replyKey);
          const replyText  = savedReply || r.reply || null;
          return `
          <div class="review-card" id="rev-${r.id}">
            <div class="review-head">
              <div class="review-ava">${escapeHTML(r.name[0])}</div>
              <div>
                <strong style="font-size:0.9rem">${escapeHTML(r.name)}</strong>
                <div style="display:flex;align-items:center;gap:0.35rem">
                  ${starsHTML(r.rating, '0.82rem')}
                  <span class="text-muted text-sm">${r.date}</span>
                </div>
              </div>
            </div>
            ${r.comment ? `<p style="color:var(--text-muted);font-size:0.875rem;line-height:1.6">${escapeHTML(r.comment)}</p>` : ''}
            ${replyText
              ? `<div class="review-reply"><strong> ${escapeHTML(barber.first_name)} replied:</strong> ${escapeHTML(replyText)}</div>`
              : (isBarber ? `
                <button class="btn btn-sm btn-ghost" style="margin-top:0.5rem;font-size:0.78rem" onclick="toggleReplyForm('${r.id}')">${t('reply_label')}</button>
                <div class="review-reply-form" id="reply-${r.id}">
                  <textarea class="form-control" rows="2" placeholder="Write a reply..." id="replyText-${r.id}" style="margin-top:0.5rem;font-size:0.82rem"></textarea>
                  <button class="btn btn-sm btn-primary" style="margin-top:0.4rem" onclick="saveReply('${r.id}','${replyKey}')">${t('reply_post')}</button>
                </div>` : '')
            }
          </div>`;
        }).join('');

        el.innerHTML = `
          <div class="fade-in">
            <div class="reviews-summary">
              <div style="text-align:center">
                <div style="font-size:3.5rem;font-weight:800;line-height:1;color:var(--primary)">${avg.toFixed(1)}</div>
                <div style="margin:0.35rem 0">${starsHTML(avg, '1.2rem')}</div>
                <p class="text-muted text-sm">${allReviews.length} ${t('reviews_count')}</p>
              </div>
              <div>
                ${counts.map(({n,cnt}) => `
                  <div class="rating-bar-row">
                    <span class="rating-bar-label">${n}</span>
                    <div class="rating-bar-track"><div class="rating-bar-fill" style="width:${allReviews.length ? (cnt/allReviews.length*100) : 0}%"></div></div>
                    <span style="font-size:0.78rem;color:var(--text-muted);min-width:20px">${cnt}</span>
                  </div>`).join('')}
              </div>
            </div>
            ${isCustomer ? `<button class="btn btn-outline btn-sm" style="margin-bottom:1.25rem" onclick="openReviewModal()">${t('write_review')}</button>` : ''}
            <div style="display:flex;flex-direction:column;gap:0.75rem">
              ${reviewHTML || `<div class="empty-state"><p>${t('no_reviews')}</p></div>`}
            </div>
          </div>`;
      }
    }

    async function toggleFav() {
      if (!user) { window.location.href = 'login.html'; return; }
      try {
        if (window.BH_API) {
          const currentlyFav = Favorites.isFav(user.id, barber.id);
          if (currentlyFav) await window.BH_API.removeFavorite(barber.id);
          else await window.BH_API.addFavorite(barber.id);
        }
      } catch (err) {
        console.warn('Favorite sync failed:', err.message);
      }
      Favorites.toggle(user.id, barber.id);
      renderProfile();
    }

    function openReviewModal() {
      reviewRating = 5;
      updateStars(5);
      document.getElementById('reviewComment').value = '';
      document.getElementById('reviewAlert').innerHTML = '';
      document.getElementById('reviewModal').classList.add('open');
    }
    function closeReviewModal() { document.getElementById('reviewModal').classList.remove('open'); }

    function updateStars(val) {
      document.querySelectorAll('#starPicker span').forEach(s => {
        s.style.color = parseInt(s.dataset.v) <= val ? 'var(--gold)' : '#4a5568';
      });
    }
    document.getElementById('starPicker').addEventListener('click', e => {
      const s = e.target.closest('span');
      if (!s) return;
      reviewRating = parseInt(s.dataset.v);
      updateStars(reviewRating);
    });
    document.getElementById('reviewModal').addEventListener('click', e => {
      if (e.target === document.getElementById('reviewModal')) closeReviewModal();
    });

    async function submitReview() {
      if (!user) return;
      const comment = document.getElementById('reviewComment').value.trim();
      try {
        if (window.BH_API) {
          await window.BH_API.addReview(barber.id, reviewRating, comment);
          barber = await loadApiBarberById(barber.id) || barber;
        } else {
          Reviews.add(barber.id, { id: 'u'+Date.now(), name: user.first_name + ' ' + user.last_name[0] + '.', rating: reviewRating, comment, date: new Date().toISOString().split('T')[0], reply: null });
        }
      } catch (err) {
        document.getElementById('reviewAlert').innerHTML = `<div class="alert alert-danger">${err.message || 'Unable to submit review.'}</div>`;
        return;
      }
      closeReviewModal();
      const reviewsBtn = document.querySelector('.master-tab-btn[data-tab="reviews"]');
      switchTab('reviews', reviewsBtn);
    }

    function toggleReplyForm(revId) {
      document.getElementById(`reply-${revId}`).classList.toggle('open');
    }
    function saveReply(revId, key) {
      const text = document.getElementById(`replyText-${revId}`).value.trim();
      if (!text) return;
      localStorage.setItem(key, text);
      renderTab('reviews');
    }

    function openLightbox(idx) {
      lbIndex = idx;
      updateLightbox();
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
    function lightboxBgClick(e) { if (e.target === document.getElementById('lightbox')) closeLightbox(); }
    function lightboxNav(dir) {
      lbIndex = (lbIndex + dir + lbPhotos.length) % lbPhotos.length;
      updateLightbox();
    }
    function updateLightbox() {
      const p = lbPhotos[lbIndex];
      document.getElementById('lightboxImg').src = p.url;
      document.getElementById('lightboxCaption').textContent = p.caption || '';
      document.getElementById('lightboxCounter').textContent = `${lbIndex+1} / ${lbPhotos.length}`;
    }
    document.addEventListener('keydown', e => {
      if (!document.getElementById('lightbox').classList.contains('open')) return;
      if (e.key === 'Escape')     closeLightbox();
      if (e.key === 'ArrowLeft')  lightboxNav(-1);
      if (e.key === 'ArrowRight') lightboxNav(1);
    });

    updateStars(5);
  </script>
</body>
</html>
