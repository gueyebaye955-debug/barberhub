<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Provider Dashboard | JOTMA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'></text></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .dash-layout { display: grid; grid-template-columns: 220px 1fr; gap: 2rem; padding: 2rem 0 4rem; }
    .dash-sidebar { height: fit-content; position: sticky; top: 80px; }
    .dash-user { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; text-align: center; margin-bottom: 1rem; }
    .dash-avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800; color: white; margin: 0 auto 0.75rem; }
    .dash-user h3 { font-size: 1rem; margin-bottom: 0.1rem; }
    .dash-user p  { color: var(--text-muted); font-size: 0.8rem; }
    .dash-nav { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .dash-nav-item { display: flex; align-items: center; gap: 0.6rem; padding: 0.8rem 1rem; font-size: 0.875rem; cursor: pointer; border-bottom: 1px solid var(--border); color: var(--text-muted); transition: all 0.15s; }
    .dash-nav-item:last-child { border-bottom: none; }
    .dash-nav-item:hover { background: var(--bg-elevated); color: var(--text); }
    .dash-nav-item.active { background: rgba(233,69,96,0.08); color: var(--primary); font-weight: 600; border-left: 3px solid var(--primary); }
    .dash-panel { display: none; }
    .dash-panel.active { display: block; }
    .dash-panel h2 { margin-bottom: 0.25rem; }
    .dash-panel .sub { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem; }
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem; }
    .stat-card .val { font-size: 2rem; font-weight: 800; color: var(--primary); }
    .stat-card .lbl { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.15rem; }
    .table-wrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { background: var(--bg-elevated); padding: 0.7rem 1rem; text-align: left; font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    td { padding: 0.75rem 1rem; border-top: 1px solid var(--border); font-size: 0.875rem; }
    .status-badge { display: inline-flex; align-items: center; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.72rem; font-weight: 700; }
    .status-pending   { background: rgba(245,158,11,0.15); color: #f59e0b; }
    .status-confirmed { background: rgba(16,185,129,0.15); color: var(--green); }
    .status-completed { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .status-cancelled { background: rgba(239,68,68,0.15); color: #ef4444; }
    .svc-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; display: flex; align-items: center; gap: 1rem; margin-bottom: 0.6rem; }
    .svc-info { flex: 1; }
    .svc-info strong { display: block; font-size: 0.95rem; }
    .svc-info span   { font-size: 0.8rem; color: var(--text-muted); }
    .svc-price { font-size: 1.1rem; font-weight: 800; color: var(--primary); margin-right: 0.75rem; }
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 999; align-items: center; justify-content: center; }
    .modal-bg.open { display: flex; }
    .modal-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.75rem; width: 100%; max-width: 440px; }
    .modal-box h3 { margin-bottom: 1.25rem; }
    .schedule-row { display: grid; grid-template-columns: 100px 60px 1fr; gap: 0.75rem; align-items: center; padding: 0.6rem 0; border-bottom: 1px solid var(--border); }
    .schedule-row:last-child { border-bottom: none; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 0.65rem; flex-wrap: wrap; margin-bottom: 0.25rem; }
    .split-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .panel-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; max-width: 520px; width: 100%; }
    .schedule-head { display: grid; grid-template-columns: 100px 60px 1fr; gap: 0.75rem; margin-bottom: 0.5rem; }
    .schedule-hours { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; flex-wrap: wrap; }
    .prefs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .msg-panel-inner { display: flex; gap: 1rem; height: 420px; }
    .msg-thread-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .msg-compose { display: flex; gap: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--border); }
    .profile-photo-head { display: flex; align-items: center; gap: 1.25rem; margin-bottom: 1.25rem; }
    .profile-photo-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    @media (max-width: 900px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 768px) {
      .dash-layout { grid-template-columns: 1fr; }
      .dash-sidebar { position: static; }
      .table-wrap { overflow-x: auto; }
      table { min-width: 540px; }
      .svc-item { flex-wrap: wrap; align-items: flex-start; }
      .split-grid-2, .prefs-grid { grid-template-columns: 1fr; }
      .panel-card { max-width: 100%; }
      .schedule-head, .schedule-row { grid-template-columns: 88px 54px 1fr; gap: 0.5rem; }
      .schedule-hours .form-control { flex: 1 1 120px; min-width: 120px; }
      .msg-panel-inner { flex-direction: column !important; height: auto !important; }
      .msg-conv-list { width: 100% !important; border-right: none !important; border-bottom: 1px solid var(--border); padding-right: 0 !important; padding-bottom: 0.75rem; max-height: 180px; overflow-y: auto; }
      .msg-thread-area { height: 300px; }
      .msg-compose { flex-direction: column; }
      .msg-compose .btn { width: 100%; }
    }
  </style>
</head>
<body class="page-wrap">
  <nav class="navbar" id="navbar"></nav>

  <main>
    <div class="container">
      <div class="dash-layout" id="dashLayout">
        <div class="loading-box" style="padding:5rem;grid-column:1/-1"><div class="spinner"></div></div>
      </div>
    </div>
  </main>

  <!-- Service modal -->
  <div class="modal-bg" id="svcModal">
    <div class="modal-box">
      <h3 id="svcModalTitle"></h3>
      <div class="form-group">
        <label class="form-label" data-i18n="svc_name_label">Service Name</label>
        <input class="form-control" id="svcName" placeholder="e.g. Haircut">
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="svc_desc_label">Description (optional)</label>
        <input class="form-control" id="svcDesc" placeholder="Short description">
      </div>
      <div class="split-grid-2">
        <div class="form-group">
          <label class="form-label" data-i18n="svc_price_label">Price ($)</label>
          <input class="form-control" type="number" id="svcPrice" placeholder="30" min="0" step="0.01">
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="svc_dur_label">Duration (min)</label>
          <input class="form-control" type="number" id="svcDur" placeholder="45" min="15" step="15">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Photo (optional)</label>
        <div id="svcImgPreviewWrap" style="display:none;margin-bottom:0.5rem">
          <img id="svcImgPreview" src="" alt="Service photo" style="width:100%;max-height:160px;object-fit:cover;border-radius:8px;border:1px solid var(--border)">
        </div>
        <input type="file" id="svcImgFile" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="onSvcImagePick(this)">
        <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('svcImgFile').click()">Upload photo</button>
        <span id="svcImgName" style="font-size:0.8rem;color:var(--text-muted);margin-left:0.5rem"></span>
      </div>
      <div id="svcModalError" style="color:#ef4444;font-size:0.85rem;margin-bottom:0.5rem;display:none"></div>
      <div style="display:flex;gap:0.75rem;justify-content:flex-end;margin-top:0.5rem">
        <button class="btn btn-ghost" onclick="closeSvcModal()" data-i18n="btn_cancel">Cancel</button>
        <button class="btn btn-primary" id="svcSaveBtn" onclick="saveService()" data-i18n="btn_save">Save Service</button>
      </div>
    </div>
  </div>

  <footer class="footer" id="footer"></footer>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/nav.js?v=14"></script>
  <script>
    renderNav('barber-dashboard');
    renderFooter();
    applyI18n();

    const user = Auth.require('barber');
    if (!user) throw new Error('redirect');

    let barber = user.barber_id ? getBarber(user.barber_id) : getAllBarbers()[0];
    if (!barber) barber = getAllBarbers()[0];

    let activeTab = 'overview';
    let editingSvcId = null;
    let conversations = [];
    let activeConvId = null;
    let convMessages = [];
    let msgPollTimer = null;
    const PORTFOLIO_MAX = 12;
    let portfolioItems = [];
    let portfolioMode = 'local';
    let portfolioLoadToken = 0;

    // ── Apply barber onboarding data collected during signup ───────────────────
    (function applyOnboarding() {
      const raw = localStorage.getItem('bh_barber_onboarding');
      if (!raw) return;
      try {
        const data = JSON.parse(raw);
        localStorage.removeItem('bh_barber_onboarding'); // consume once

        // Apply shop name to local profile store
        const profiles = JSON.parse(localStorage.getItem('bh_barber_profiles') || '{}');
        if (!profiles[barber.id]) profiles[barber.id] = { ...barber, id: barber.id };
        if (data.shop_name) profiles[barber.id].shop_name = data.shop_name;
        if (data.instagram) profiles[barber.id].instagram = data.instagram;
        if (data.years_exp) profiles[barber.id].years_experience = parseInt(data.years_exp, 10);
        localStorage.setItem('bh_barber_profiles', JSON.stringify(profiles));

        // Apply services with prices
        if (Array.isArray(data.services) && data.services.length > 0) {
          const svcs = data.services.map((s, i) => ({
            id: Date.now() + i,
            name: s.name,
            price: s.price,
            duration: s.duration || 30,
            description: s.description || '',
            category: s.name === 'Kids Cut' ? 'Kids' : s.name.toLowerCase().includes('beard') || s.name.toLowerCase().includes('shave') ? 'Beard' : 'Cuts'
          }));
          localStorage.setItem(`bh_services_${barber.id}`, JSON.stringify(svcs));
          // Patch barber object too so render() picks it up immediately
          barber = { ...barber, ...profiles[barber.id], services: svcs };
        } else {
          barber = { ...barber, ...profiles[barber.id] };
        }
      } catch (_) {}
    })();

    // Services are loaded from the API; this array is the local cache
    let _services = Array.isArray(barber.services) ? barber.services.map(s => ({
      ...s,
      price: typeof s.price === 'number' && s.price > 100 ? s.price / 100 : s.price,
    })) : [];

    function getServices() { return _services; }

    async function loadServicesFromAPI() {
      try {
        const rows = await BH_API.getMyServices();
        if (Array.isArray(rows)) {
          _services = rows.map(s => ({ ...s, price: s.price / 100 }));
          render();
        }
      } catch (_) {}
    }

    // Kick off API load immediately
    loadServicesFromAPI();

    // selected image file for upload (set by onSvcImagePick)
    let _svcImageDataUri = null;

    const SCHED_KEY = `bh_schedule_${barber.id}`;
    function getSchedule() {
      const stored = localStorage.getItem(SCHED_KEY);
      return stored ? JSON.parse(stored) : [...barber.availability];
    }
    function saveSchedule(sched) { localStorage.setItem(SCHED_KEY, JSON.stringify(sched)); }

    const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    function render() {
      const bookings  = Bookings.getForBarber(barber.id);
      const services  = getServices();
      const schedule  = getSchedule();
      const calPrefs  = getBarberCalendarPrefs(barber.id);
      const pending   = bookings.filter(b => b.status === 'pending');
      const confirmed = bookings.filter(b => b.status === 'confirmed');
      const completed = bookings.filter(b => b.status === 'completed');
      const revenue   = bookings.filter(b => b.status === 'completed').reduce((s,b) => s + parseFloat(b.price||0), 0);
      const custIds   = [...new Set(bookings.map(b => b.customer_id))];
      const pBadge    = pending.length ? ` <span style="margin-left:auto;background:var(--primary);color:white;font-size:0.7rem;padding:0.1rem 0.45rem;border-radius:10px">${pending.length}</span>` : '';

      document.getElementById('dashLayout').innerHTML = `
        <!-- Sidebar -->
        <div class="dash-sidebar">
          <div class="dash-user">
            <div class="dash-avatar" style="overflow:hidden">${getBarberAvatar(barber) ? `<img src="${getBarberAvatar(barber)}" alt="${escapeHTML(barber.first_name)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">` : escapeHTML(barber.first_name[0]+barber.last_name[0])}</div>
            <h3>${escapeHTML(barber.shop_name || barber.first_name + ' ' + barber.last_name)}</h3>
            <p style="margin-bottom:0.35rem">${escapeHTML(barber.city)}</p>
            ${barber.verified ? '<span style="font-size:0.72rem;background:rgba(245,158,11,0.2);color:#f59e0b;padding:0.1rem 0.5rem;border-radius:10px"> Verified</span>' : ''}
          </div>
          <nav class="dash-nav">
            <div class="dash-nav-item ${activeTab==='overview'?'active':''}" onclick="switchTab('overview')"> ${t('bdash_overview')}</div>
            <div class="dash-nav-item ${activeTab==='bookings'?'active':''}" onclick="switchTab('bookings')"> ${t('bdash_all_bookings')}${pBadge}</div>
            <div class="dash-nav-item ${activeTab==='services'?'active':''}" onclick="switchTab('services')"> ${t('bdash_services')}</div>
            <div class="dash-nav-item ${activeTab==='schedule'?'active':''}" onclick="switchTab('schedule')"> ${t('bdash_schedule')}</div>
            <div class="dash-nav-item ${activeTab==='customers'?'active':''}" onclick="switchTab('customers')"> ${t('bdash_customers')}</div>
            <div class="dash-nav-item ${activeTab==='messages'?'active':''}" onclick="switchTab('messages')"> Messages${conversations.reduce((s,c)=>s+Number(c.unread_count||0),0)?` <span style="margin-left:auto;background:var(--primary);color:white;font-size:0.7rem;padding:0.1rem 0.45rem;border-radius:10px">${conversations.reduce((s,c)=>s+Number(c.unread_count||0),0)}</span>`:''}</div>
            <div class="dash-nav-item ${activeTab==='profile'?'active':''}" onclick="switchTab('profile')"> ${t('dash_profile')}</div>
            <div class="dash-nav-item" onclick="Auth.logout()" style="color:var(--text-muted)">${t('dash_signout')}</div>
          </nav>
        </div>

        <!-- Panels -->
        <div>
          <!-- Overview -->
          <div class="dash-panel ${activeTab==='overview'?'active':''}" id="panel-overview">
            <h2>${t('bdash_overview')}</h2>
            <p class="sub">${t('bdash_welcome')} ${escapeHTML(barber.first_name)}!</p>
            <div class="stat-grid">
              <div class="stat-card"><div class="val">${pending.length}</div><div class="lbl">${t('bdash_pending_req')}</div></div>
              <div class="stat-card"><div class="val">${confirmed.length}</div><div class="lbl">${t('bdash_confirmed')}</div></div>
              <div class="stat-card"><div class="val">${completed.length}</div><div class="lbl">${t('bdash_completed')}</div></div>
              <div class="stat-card"><div class="val">${fmtPrice(revenue)}</div><div class="lbl">${t('bdash_revenue')}</div></div>
            </div>
            ${pending.length > 0 ? `
              <h3 style="margin-bottom:1rem">${t('bdash_pending_req')} (${pending.length})</h3>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Customer</th><th>Service</th><th>Date</th><th>Time</th><th>Actions</th></tr></thead>
                  <tbody>
                    ${pending.map(b => `<tr>
                      <td><strong>Customer #${b.customer_id}</strong></td>
                      <td>${escapeHTML(b.service_name)}</td>
                      <td>${b.date}</td>
                      <td>${b.time}</td>
                      <td style="display:flex;gap:0.4rem">
                        <button class="btn btn-sm" style="background:rgba(16,185,129,0.1);color:var(--green);border:1px solid rgba(16,185,129,0.3)" onclick="updateStatus(${b.id},'confirmed')">${t('bdash_confirm_btn')}</button>
                        <button class="btn btn-sm" style="background:rgba(239,68,68,0.1);color:#ef4444;border:1px solid rgba(239,68,68,0.3)" onclick="updateStatus(${b.id},'cancelled')">${t('bdash_decline_btn')}</button>
                      </td>
                    </tr>`).join('')}
                  </tbody>
                </table>
              </div>` : `<div style="text-align:center;padding:2rem;color:var(--text-muted);background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius)">
                <div style="font-size:2rem;margin-bottom:0.5rem"></div>
                <p>No pending requests.</p>
              </div>`}
          </div>

          <!-- Bookings -->
          <div class="dash-panel ${activeTab==='bookings'?'active':''}" id="panel-bookings">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:0.75rem;flex-wrap:wrap">
              <h2>${t('bdash_all_bookings')}</h2>
              <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
                <button class="btn btn-ghost btn-sm" onclick="exportConfirmedCalendar()">Export Confirmed (.ics)</button>
                <button class="btn btn-primary btn-sm" onclick="syncNextBookingToGoogle()">Sync Next to Google</button>
              </div>
            </div>
            <p class="sub">Manage all your appointments</p>
            ${bookings.length === 0 ? `<div style="text-align:center;padding:3rem;color:var(--text-muted)"><div style="font-size:3rem;margin-bottom:1rem"></div><p>${t('no_bookings')}</p></div>` : `
            <div class="table-wrap">
              <table>
                <thead><tr><th>Customer</th><th>Service</th><th>Date & Time</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody>
                  ${[...bookings].reverse().map(b => `<tr>
                    <td>Customer #${b.customer_id}</td>
                    <td>${escapeHTML(b.service_name)}</td>
                    <td>${b.date}<br><span style="color:var(--text-muted);font-size:0.8rem">${b.time}</span></td>
                    <td>${fmtPrice(b.price)}</td>
                    <td><span class="status-badge status-${b.status}">${b.status}</span></td>
                    <td>
                      ${b.status==='pending'?`<button class="btn btn-sm" style="background:rgba(16,185,129,0.1);color:var(--green);border:1px solid rgba(16,185,129,0.3)" onclick="updateStatus(${b.id},'confirmed')">${t('bdash_confirm_btn')}</button>`:''}
                      ${b.status==='confirmed'?`<button class="btn btn-sm" style="background:rgba(59,130,246,0.1);color:#60a5fa;border:1px solid rgba(59,130,246,0.3)" onclick="updateStatus(${b.id},'completed')">${t('bdash_complete_btn')}</button>`:''}
                      ${b.status==='pending'||b.status==='confirmed'?`<button class="btn btn-sm" style="background:rgba(239,68,68,0.1);color:#ef4444;border:1px solid rgba(239,68,68,0.3);margin-left:0.3rem" onclick="updateStatus(${b.id},'cancelled')">${t('bdash_decline_btn')}</button>`:''}
                    </td>
                  </tr>`).join('')}
                </tbody>
              </table>
            </div>`}
          </div>

          <!-- Services -->
          <div class="dash-panel ${activeTab==='services'?'active':''}" id="panel-services">
            <div class="panel-head">
              <h2>${t('bdash_services')}</h2>
              <button class="btn btn-primary btn-sm" onclick="openSvcModal(null)">${t('bdash_add_service')}</button>
            </div>
            <p class="sub">${t('bdash_services_sub')}</p>
            ${getServices().map(s => `
              <div class="svc-item" style="align-items:flex-start;gap:0.75rem">
                ${s.image_url ? `<img src="${escapeHTML(s.image_url)}" alt="" style="width:60px;height:60px;object-fit:cover;border-radius:8px;flex-shrink:0">` : ''}
                <div class="svc-info" style="flex:1;min-width:0">
                  <strong>${escapeHTML(s.name)}</strong>
                  <span>${escapeHTML(s.desc || '')} &nbsp;&nbsp;  ${fmtDur(s.duration)}</span>
                </div>
                <span class="svc-price">${fmtPrice(s.price)}</span>
                <button class="btn btn-sm btn-ghost" onclick="openSvcModal(${s.id})">Edit</button>
                <button class="btn btn-sm" style="background:rgba(239,68,68,0.1);color:#ef4444;border:1px solid rgba(239,68,68,0.3);margin-left:0.3rem" onclick="deleteService(${s.id})">Delete</button>
              </div>`).join('')}
          </div>

          <!-- Schedule -->
          <div class="dash-panel ${activeTab==='schedule'?'active':''}" id="panel-schedule">
            <h2>${t('bdash_schedule')}</h2>
            <p class="sub">${t('bdash_schedule_sub')}</p>
            <div id="scheduleAlert"></div>
            <div class="panel-card">
              <div class="schedule-head">
                <span style="font-size:0.78rem;color:var(--text-muted);font-weight:600;text-transform:uppercase">Day</span>
                <span style="font-size:0.78rem;color:var(--text-muted);font-weight:600;text-transform:uppercase">Open</span>
                <span style="font-size:0.78rem;color:var(--text-muted);font-weight:600;text-transform:uppercase">Hours</span>
              </div>
              ${getSchedule().map(a => `
                <div class="schedule-row">
                  <strong>${DAYS[a.day]}</strong>
                  <label style="display:flex;align-items:center;cursor:pointer">
                    <input type="checkbox" ${a.open?'checked':''} onchange="toggleDay(${a.day},this.checked)" style="width:16px;height:16px;cursor:pointer">
                  </label>
                  <div class="schedule-hours">
                    <input type="time" value="${a.start||'09:00'}" ${!a.open?'disabled':''} onchange="updateHours(${a.day},'start',this.value)" class="form-control" style="padding:0.3rem 0.5rem;width:auto">
                    <span></span>
                    <input type="time" value="${a.end||'18:00'}" ${!a.open?'disabled':''} onchange="updateHours(${a.day},'end',this.value)" class="form-control" style="padding:0.3rem 0.5rem;width:auto">
                  </div>
                </div>`).join('')}
            </div>
            <div class="panel-card" style="margin-top:1rem">
              <h3 style="font-size:0.9rem;margin-bottom:0.9rem">Calendar Rules</h3>
              <div class="prefs-grid">
                <div class="form-group" style="margin-bottom:0">
                  <label class="form-label">Buffer Before (min)</label>
                  <input class="form-control" type="number" min="0" step="5" id="prefBufferBefore" value="${calPrefs.buffer_before}">
                </div>
                <div class="form-group" style="margin-bottom:0">
                  <label class="form-label">Cleanup Buffer (min)</label>
                  <input class="form-control" type="number" min="0" step="5" id="prefBufferAfter" value="${calPrefs.buffer_after}">
                </div>
                <div class="form-group" style="margin-bottom:0">
                  <label class="form-label">Travel Time (min)</label>
                  <input class="form-control" type="number" min="0" step="5" id="prefTravelBuffer" value="${calPrefs.travel_buffer}">
                </div>
                <div class="form-group" style="margin-bottom:0;display:flex;align-items:flex-end">
                  <label style="display:flex;align-items:center;gap:0.45rem;font-size:0.85rem;cursor:pointer">
                    <input type="checkbox" id="prefLunchEnabled" ${calPrefs.lunch_enabled ? 'checked' : ''}>
                    Enable lunch break
                  </label>
                </div>
                <div class="form-group" style="margin-bottom:0">
                  <label class="form-label">Lunch Start</label>
                  <input class="form-control" type="time" id="prefLunchStart" value="${calPrefs.lunch_start}">
                </div>
                <div class="form-group" style="margin-bottom:0">
                  <label class="form-label">Lunch End</label>
                  <input class="form-control" type="time" id="prefLunchEnd" value="${calPrefs.lunch_end}">
                </div>
              </div>
              <p style="font-size:0.75rem;color:var(--text-muted);margin-top:0.8rem">These rules apply automatically when customers pick slots and when your next available time is shown.</p>
            </div>
            <button class="btn btn-primary" style="margin-top:1.25rem" onclick="saveScheduleBtn()">${t('bdash_save_schedule')}</button>
          </div>

          <!-- Customers -->
          <div class="dash-panel ${activeTab==='customers'?'active':''}" id="panel-customers">
            <h2>${t('bdash_customers')}</h2>
            <p class="sub">People who have booked with you (${custIds.length} total)</p>
            ${custIds.length === 0 ? `<div style="text-align:center;padding:3rem;color:var(--text-muted)"><div style="font-size:3rem;margin-bottom:1rem"></div><p>No customers yet.</p></div>` : `
            <div class="table-wrap">
              <table>
                <thead><tr><th>Customer ID</th><th>Bookings</th><th>Last Visit</th><th>Revenue</th></tr></thead>
                <tbody>
                  ${custIds.map(cId => {
                    const cBookings = bookings.filter(b => b.customer_id === cId && b.status !== 'cancelled');
                    const lastDate = cBookings.map(b => b.date).sort().reverse()[0] || '';
                    const rev = cBookings.filter(b=>b.status==='completed').reduce((s,b)=>s+parseFloat(b.price||0),0);
                    return `<tr>
                      <td><strong>Customer #${cId}</strong></td>
                      <td>${cBookings.length}</td>
                      <td>${lastDate}</td>

            </div>`}
          </div>

          <!-- Messages -->
          <div class="dash-panel ${activeTab==='messages'?'active':''}" id="panel-messages">
            <h2> Messages</h2>
            <p class="sub">Chat with your customers</p>
            <div class="msg-panel-inner">
              <div class="msg-conv-list" style="width:220px;flex-shrink:0;overflow-y:auto;border-right:1px solid var(--border);padding-right:0.75rem">
                ${conversations.length === 0
                  ? `<p style="color:var(--text-muted);font-size:0.85rem;margin-top:1rem">No conversations yet.</p>`
                  : conversations.map(c => `
                    <div onclick="openConv(${c.other_id})"
                      style="padding:0.65rem 0.5rem;border-radius:8px;cursor:pointer;margin-bottom:0.25rem;background:${activeConvId===c.other_id?'rgba(233,69,96,0.12)':'transparent'};display:flex;justify-content:space-between;align-items:center">
                      <div>
                        <div style="font-weight:600;font-size:0.9rem">${escapeHTML(c.other_name)}</div>
                        <div style="font-size:0.75rem;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px">${escapeHTML(c.last_message||'')}</div>
                      </div>
                      ${c.unread_count>0?`<span style="background:var(--primary);color:#fff;font-size:0.68rem;padding:0.1rem 0.4rem;border-radius:10px">${c.unread_count}</span>`:''}
                    </div>`).join('')
                }
              </div>
              <div class="msg-thread-area">
                ${activeConvId === null
                  ? `<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-muted)">Select a conversation</div>`
                  : `<div id="msgThread" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:0.5rem;padding:0.5rem 0">
                      ${convMessages.map(m => `
                        <div style="display:flex;justify-content:${m.sender_id===user.id?'flex-end':'flex-start'}">
                          <div style="max-width:72%;padding:0.5rem 0.85rem;border-radius:16px;${m.sender_id===user.id?'background:var(--primary);color:#fff;border-bottom-right-radius:4px':'background:var(--surface2);border-bottom-left-radius:4px'};font-size:0.9rem">
                            ${escapeHTML(m.content)}
                            <div style="font-size:0.65rem;margin-top:0.2rem;opacity:0.6;text-align:right">${timeAgo(m.created_at)}</div>
                          </div>
                        </div>`).join('')}
                    </div>
                    <form onsubmit="sendMsg(event)" class="msg-compose">
                      <input id="msgInput" class="form-control" placeholder="Type a message…" style="flex:1" autocomplete="off">
                      <button class="btn btn-primary" type="submit">Send</button>
                    </form>`
                }
              </div>
            </div>
          </div>

          <!-- Profile / Avatar -->
          <div class="dash-panel ${activeTab==='profile'?'active':''}" id="panel-profile">
            <h2>${t('dash_profile')}</h2>
            <p class="sub">Update your public photo and profile details</p>
            <div id="bdashProfileAlert"></div>

            <!-- Avatar -->
            <div class="panel-card" style="padding:1.5rem;margin-bottom:1.25rem">
              <h3 style="font-size:0.95rem;margin-bottom:1rem"> Profile Photo</h3>
              <div class="profile-photo-head">
                <div style="width:72px;height:72px;border-radius:50%;overflow:hidden;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;color:white;flex-shrink:0">
                  ${getBarberAvatar(barber) ? `<img src="${getBarberAvatar(barber)}" alt="${barber.first_name}" style="width:100%;height:100%;object-fit:cover">` : barber.first_name[0] + barber.last_name[0]}
                </div>
                <div style="flex:1">
                  <input class="form-control" id="avatarUrlInput" placeholder="https://example.com/photo.jpg" value="${getBarberAvatar(barber)||''}" style="margin-bottom:0.4rem">
                  <p style="font-size:0.75rem;color:var(--text-muted)">Paste an image URL, or upload/take a photo from your phone.</p>
                  <input type="file" id="avatarFileInput" accept="image/*" style="display:none" onchange="handleAvatarUpload(this)">
                  <input type="file" id="avatarCameraInput" accept="image/*" capture="environment" style="display:none" onchange="handleAvatarUpload(this)">
                </div>
              </div>
              <div class="profile-photo-actions">
                <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('avatarFileInput').click()">Upload from device</button>
                <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('avatarCameraInput').click()">Take photo</button>
                <button class="btn btn-primary btn-sm" onclick="saveAvatar()"> Save Photo</button>
                ${getBarberAvatar(barber) ? `<button class="btn btn-ghost btn-sm" onclick="removeAvatar()">Remove</button>` : ''}
                <a class="btn btn-ghost btn-sm" href="https://www.google.com/business/" target="_blank" rel="noopener">Manage Google Business Profile</a>
              </div>
            </div>

            <!-- Shop info (only editable for dynamic barbers) -->
            ${barber._dynamic ? `
            <div class="panel-card" style="padding:1.5rem">
              <h3 style="font-size:0.95rem;margin-bottom:1rem"> Shop Information</h3>
              <div class="form-group">
                <label class="form-label">Shop Name</label>
                <input class="form-control" id="pShopName" value="${barber.shop_name||''}">
              </div>
              <div class="form-group">
                <label class="form-label">Bio</label>
                <textarea class="form-control" id="pBio" rows="3" placeholder="Tell customers about yourself...">${barber.bio||''}</textarea>
              </div>
              <div class="split-grid-2">
                <div class="form-group">
                  <label class="form-label">City</label>
                  <input class="form-control" id="pCity" value="${barber.city||''}">
                </div>
                <div class="form-group">
                  <label class="form-label">Years Experience</label>
                  <input class="form-control" type="number" id="pExp" min="0" value="${barber.years_experience||0}">
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Full Address</label>
                <input class="form-control" id="pLocation" value="${barber.location||''}" placeholder="Street, City, State">
              </div>
              <div class="form-group">
                <label class="form-label">Cancellation Notice (hours)</label>
                <input class="form-control" type="number" id="pCancel" min="0" value="${barber.cancellation_hours||24}">
              </div>
              <button class="btn btn-primary" onclick="saveShopInfo()"> Save Shop Info</button>
            </div>` : `
            <div class="panel-card" style="color:var(--text-muted);font-size:0.875rem">
               This is a demo barber profile. Shop details are managed in data.js.
            </div>`}

            <div class="panel-card portfolio-manager-card" style="padding:1.5rem;margin-top:1.25rem;max-width:760px">
              <div class="portfolio-manager-head">
                <h3 style="font-size:0.95rem">${t('portfolio_manage')}</h3>
                <span class="portfolio-count" id="portfolioCountLabel">0/${PORTFOLIO_MAX}</span>
              </div>
              <input type="file" id="portfolioFileInput" accept="image/*" style="display:none" onchange="handlePhotoUpload(this)">
              <button class="btn btn-primary" style="width:100%;margin-bottom:0.75rem;font-size:1rem;padding:0.75rem" onclick="document.getElementById('portfolioFileInput').click()">
                📷 Upload Photo from Device
              </button>
              <div style="text-align:center;color:var(--text-muted);font-size:0.8rem;margin-bottom:0.75rem">— or paste an image URL below —</div>
              <div class="portfolio-add-grid">
                <input class="form-control" id="portfolioUrlInput" placeholder="${t('portfolio_add_url_ph')}" inputmode="url" autocomplete="off">
                <input class="form-control" id="portfolioCaptionInput" placeholder="${t('portfolio_caption_ph')}" maxlength="160" autocomplete="off">
              </div>
              <div style="display:flex;align-items:center;justify-content:space-between;gap:0.75rem;flex-wrap:wrap;margin-top:0.75rem">
                <button class="btn btn-primary btn-sm" id="portfolioAddBtn" onclick="addPortfolioPhoto()">${t('portfolio_add_btn')}</button>
                <span class="text-muted text-sm">${t('portfolio_reorder_hint')}</span>
              </div>
              <div id="portfolioManagerAlert" style="margin-top:0.75rem"></div>
              <div id="portfolioManagerList" class="portfolio-manager-list" style="margin-top:0.9rem"></div>
            </div>
          </div>
        </div>`;

      if (activeTab === 'profile') {
        loadPortfolioManager();
      }
    }

    function timeAgo(iso) {
      const diff = Date.now() - new Date(iso).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1)   return 'just now';
      if (mins < 60)  return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24)   return `${hrs}h ago`;
      return `${Math.floor(hrs / 24)}d ago`;
    }

    function switchTab(tab) {
      activeTab = tab;
      if (tab === 'messages') {
        loadConversations();
        startMsgPoll();
      } else {
        stopMsgPoll();
      }
      render();
    }

    async function loadConversations() {
      if (!window.BH_API) return;
      try {
        conversations = await window.BH_API.getConversations();
        render();
      } catch (_) {}
    }

    async function openConv(otherId) {
      activeConvId = otherId;
      if (!window.BH_API) return;
      try {
        convMessages = await window.BH_API.getMessages(otherId);
        await window.BH_API.markRead(otherId);
        conversations = conversations.map(c => c.other_id === otherId ? { ...c, unread_count: 0 } : c);
      } catch (_) {}
      render();
      scrollMsgThread();
    }

    async function sendMsg(e) {
      e.preventDefault();
      if (!activeConvId || !window.BH_API) return;
      const input = document.getElementById('msgInput');
      const content = input.value.trim();
      if (!content) return;
      input.value = '';
      try {
        const msg = await window.BH_API.sendMessage(activeConvId, content);
        convMessages.push(msg);
        render();
        scrollMsgThread();
      } catch (err) {
        alert(err.message || 'Failed to send message.');
      }
    }

    function scrollMsgThread() {
      setTimeout(() => {
        const el = document.getElementById('msgThread');
        if (el) el.scrollTop = el.scrollHeight;
      }, 50);
    }

    function startMsgPoll() {
      stopMsgPoll();
      msgPollTimer = setInterval(async () => {
        if (activeConvId) {
          try {
            const fresh = await window.BH_API.getMessages(activeConvId);
            if (fresh.length !== convMessages.length) {
              convMessages = fresh;
              await window.BH_API.markRead(activeConvId);
              render();
              scrollMsgThread();
            }
          } catch (_) {}
        }
        try {
          const freshConvs = await window.BH_API.getConversations();
          const prevTotal = conversations.reduce((s, c) => s + Number(c.unread_count || 0), 0);
          const newTotal = freshConvs.reduce((s, c) => s + Number(c.unread_count || 0), 0);
          conversations = freshConvs;
          if (newTotal !== prevTotal) render();
        } catch (_) {}
      }, 5000);
    }

    function stopMsgPoll() {
      if (msgPollTimer) { clearInterval(msgPollTimer); msgPollTimer = null; }
    }

    function isValidPortfolioImageUrl(value) {
      const raw = String(value || '').trim();
      if (!raw) return false;
      try {
        const parsed = new URL(raw);
        if (parsed.protocol === 'https:') return true;
        if (parsed.protocol !== 'http:') return false;
        const host = parsed.hostname.toLowerCase();
        return host === 'localhost' || host === '127.0.0.1' || host === '::1';
      } catch (_) {
        return false;
      }
    }

    function normalizePortfolioItem(item, index) {
      const rawUrl = typeof item?.url === 'string' ? item.url : item?.image_url;
      if (typeof rawUrl !== 'string' || !rawUrl.trim()) return null;
      const numericId = Number.parseInt(item?.id, 10);
      return {
        id: Number.isInteger(numericId) && numericId > 0 ? numericId : (Date.now() + index),
        url: rawUrl.trim(),
        caption: typeof item?.caption === 'string' ? item.caption : '',
        sort_order: Number.isFinite(Number(item?.sort_order)) ? Number(item.sort_order) : index,
        created_at: item?.created_at || new Date().toISOString()
      };
    }

    function getBarberProfilesStore() {
      return JSON.parse(localStorage.getItem('bh_barber_profiles') || '{}');
    }

    function saveBarberProfilesStore(store) {
      localStorage.setItem('bh_barber_profiles', JSON.stringify(store));
    }

    function ensureLocalBarberProfile(store) {
      if (!store[barber.id]) {
        store[barber.id] = {
          ...barber,
          id: barber.id,
          _dynamic: true
        };
      }
      if (!Array.isArray(store[barber.id].portfolio)) {
        store[barber.id].portfolio = Array.isArray(barber.portfolio) ? barber.portfolio : [];
      }
      return store[barber.id];
    }

    function syncBarberPortfolioState(items) {
      barber = {
        ...barber,
        portfolio: items,
        portfolio_count: items.length
      };
    }

    function setLocalPortfolio(items) {
      const normalized = items
        .map((item, idx) => normalizePortfolioItem(item, idx))
        .filter(Boolean)
        .slice(0, PORTFOLIO_MAX)
        .map((item, idx) => ({ ...item, sort_order: idx }));

      const profiles = getBarberProfilesStore();
      const profile = ensureLocalBarberProfile(profiles);
      profile.portfolio = normalized.map((item, idx) => ({
        id: item.id,
        url: item.url,
        caption: item.caption || '',
        sort_order: idx,
        created_at: item.created_at || new Date().toISOString()
      }));
      profile.portfolio_count = profile.portfolio.length;
      saveBarberProfilesStore(profiles);
      syncBarberPortfolioState(profile.portfolio);
      return profile.portfolio;
    }

    function getLocalPortfolio() {
      const profiles = getBarberProfilesStore();
      const profile = ensureLocalBarberProfile(profiles);
      saveBarberProfilesStore(profiles);
      const list = Array.isArray(profile.portfolio) ? profile.portfolio : [];
      return list
        .map((item, idx) => normalizePortfolioItem(item, idx))
        .filter(Boolean)
        .sort((a, b) => Number(a.sort_order || 0) - Number(b.sort_order || 0))
        .slice(0, PORTFOLIO_MAX)
        .map((item, idx) => ({ ...item, sort_order: idx }));
    }

    function showPortfolioAlert(message, type = 'success') {
      const el = document.getElementById('portfolioManagerAlert');
      if (!el) return;
      const cls = type === 'error' ? 'alert-danger' : (type === 'warning' ? 'alert-warning' : 'alert-success');
      el.innerHTML = `<div class="alert ${cls}">${escapeHTML(message)}</div>`;
      if (type !== 'error') {
        setTimeout(() => {
          const target = document.getElementById('portfolioManagerAlert');
          if (target) target.innerHTML = '';
        }, 2800);
      }
    }

    function renderPortfolioManager() {
      const listEl = document.getElementById('portfolioManagerList');
      const countEl = document.getElementById('portfolioCountLabel');
      const addBtn = document.getElementById('portfolioAddBtn');
      if (!listEl || !countEl) return;

      const safeItems = portfolioItems
        .map((item, idx) => normalizePortfolioItem(item, idx))
        .filter(Boolean)
        .slice(0, PORTFOLIO_MAX)
        .map((item, idx) => ({ ...item, sort_order: idx }));

      portfolioItems = safeItems;
      syncBarberPortfolioState(safeItems);
      countEl.textContent = `${safeItems.length}/${PORTFOLIO_MAX}`;
      if (addBtn) addBtn.disabled = safeItems.length >= PORTFOLIO_MAX;

      if (!safeItems.length) {
        listEl.innerHTML = `<div class="empty-state" style="padding:1.2rem 0.5rem"><p>${t('no_portfolio')}</p></div>`;
        return;
      }

      listEl.innerHTML = safeItems.map((item, index) => `
        <div class="portfolio-manager-item card">
          <img class="portfolio-manager-thumb" src="${escapeHTML(item.url)}" alt="${escapeHTML(item.caption || 'Portfolio photo')}" loading="lazy">
          <div class="portfolio-manager-body">
            <input class="form-control portfolio-caption-input" id="portfolioCaptionEdit_${index}" maxlength="160" value="${escapeHTML(item.caption || '')}" placeholder="${t('portfolio_caption_ph')}">
            <div class="portfolio-manager-actions">
              <button class="btn btn-ghost btn-sm" onclick="savePortfolioCaption(${index})">${t('btn_save')}</button>
              <button class="btn btn-ghost btn-sm" onclick="movePortfolioPhoto(${index}, -1)" ${index === 0 ? 'disabled' : ''}>${t('portfolio_move_up')}</button>
              <button class="btn btn-ghost btn-sm" onclick="movePortfolioPhoto(${index}, 1)" ${index === safeItems.length - 1 ? 'disabled' : ''}>${t('portfolio_move_down')}</button>
              <button class="btn btn-sm" style="background:rgba(239,68,68,0.1);color:#ef4444;border:1px solid rgba(239,68,68,0.3)" onclick="deletePortfolioPhoto(${index})">${t('portfolio_delete')}</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function loadPortfolioManager() {
      const listEl = document.getElementById('portfolioManagerList');
      if (!listEl) return;

      const token = ++portfolioLoadToken;
      listEl.innerHTML = `<div class="loading-box" style="padding:1rem"><div class="spinner"></div><p>Loading portfolio...</p></div>`;

      if (window.BH_API) {
        try {
          const rows = await window.BH_API.getMyPortfolio();
          if (token !== portfolioLoadToken) return;
          portfolioMode = 'api';
          portfolioItems = (Array.isArray(rows) ? rows : [])
            .map((row, idx) => normalizePortfolioItem(row, idx))
            .filter(Boolean)
            .sort((a, b) => Number(a.sort_order || 0) - Number(b.sort_order || 0));
          setLocalPortfolio(portfolioItems);
          renderPortfolioManager();
          return;
        } catch (error) {
          console.warn('Portfolio API unavailable, switching to local fallback:', error.message);
          portfolioMode = 'local';
          showPortfolioAlert(t('portfolio_api_fallback'), 'warning');
        }
      } else {
        portfolioMode = 'local';
      }

      if (token !== portfolioLoadToken) return;
      portfolioItems = getLocalPortfolio();
      setLocalPortfolio(portfolioItems);
      renderPortfolioManager();
    }

    async function addPortfolioPhoto() {
      const urlInput = document.getElementById('portfolioUrlInput');
      const captionInput = document.getElementById('portfolioCaptionInput');
      if (!urlInput || !captionInput) return;

      const imageUrl = urlInput.value.trim();
      const caption = captionInput.value.trim();
      if (!isValidPortfolioImageUrl(imageUrl)) {
        showPortfolioAlert(t('portfolio_invalid_url'), 'error');
        return;
      }
      if (caption.length > 160) {
        showPortfolioAlert(t('portfolio_caption_too_long'), 'error');
        return;
      }
      if (portfolioItems.length >= PORTFOLIO_MAX) {
        showPortfolioAlert(t('portfolio_max_reached'), 'error');
        return;
      }

      if (portfolioMode === 'api' && window.BH_API) {
        try {
          await window.BH_API.addMyPortfolioPhoto(imageUrl, caption);
          urlInput.value = '';
          captionInput.value = '';
          showPortfolioAlert(t('portfolio_add_success'));
          await loadPortfolioManager();
          return;
        } catch (error) {
          console.warn('Portfolio add via API failed, using local fallback:', error.message);
          portfolioMode = 'local';
          showPortfolioAlert(t('portfolio_api_fallback'), 'warning');
        }
      }

      const localAdded = [
        ...portfolioItems,
        {
          id: Date.now(),
          url: imageUrl,
          caption,
          sort_order: portfolioItems.length,
          created_at: new Date().toISOString()
        }
      ];
      portfolioItems = setLocalPortfolio(localAdded);
      renderPortfolioManager();
      urlInput.value = '';
      captionInput.value = '';
      showPortfolioAlert(t('portfolio_add_success'));
    }

    function handlePhotoUpload(input) {
      const file = input.files && input.files[0];
      input.value = '';
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showPortfolioAlert('Please select an image file.', 'error');
        return;
      }
      if (portfolioItems.length >= PORTFOLIO_MAX) {
        showPortfolioAlert(t('portfolio_max_reached'), 'error');
        return;
      }

      showPortfolioAlert('Resizing photo…', 'info');
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = async function() {
          // Resize to max 800px on longest side
          const MAX = 800;
          let w = img.width, h = img.height;
          if (w > h) { if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; } }
          else        { if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; } }

          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);

          // Compress as JPEG quality 0.78 (typically ~60-120 KB)
          const base64 = canvas.toDataURL('image/jpeg', 0.78);

          const caption = document.getElementById('portfolioCaptionInput')?.value?.trim() || '';

          if (portfolioMode === 'api' && window.BH_API) {
            try {
              await window.BH_API.uploadMyPortfolioPhoto(base64, caption);
              if (document.getElementById('portfolioCaptionInput')) document.getElementById('portfolioCaptionInput').value = '';
              showPortfolioAlert(t('portfolio_add_success'));
              await loadPortfolioManager();
              return;
            } catch (err) {
              console.warn('Upload via API failed, saving locally:', err.message);
              portfolioMode = 'local';
              showPortfolioAlert(t('portfolio_api_fallback'), 'warning');
            }
          }

          // Local fallback
          const localAdded = [
            ...portfolioItems,
            { id: Date.now(), url: base64, caption, sort_order: portfolioItems.length, created_at: new Date().toISOString() }
          ];
          portfolioItems = setLocalPortfolio(localAdded);
          renderPortfolioManager();
          if (document.getElementById('portfolioCaptionInput')) document.getElementById('portfolioCaptionInput').value = '';
          showPortfolioAlert(t('portfolio_add_success'));
        };
        img.onerror = () => showPortfolioAlert('Could not read image. Try a different file.', 'error');
        img.src = e.target.result;
      };
      reader.onerror = () => showPortfolioAlert('Could not read file. Try again.', 'error');
      reader.readAsDataURL(file);
    }

    async function savePortfolioCaption(index) {
      const item = portfolioItems[index];
      const input = document.getElementById(`portfolioCaptionEdit_${index}`);
      if (!item || !input) return;
      const caption = input.value.trim();

      if (caption.length > 160) {
        showPortfolioAlert(t('portfolio_caption_too_long'), 'error');
        return;
      }

      if (portfolioMode === 'api' && window.BH_API) {
        try {
          await window.BH_API.updateMyPortfolioPhoto(item.id, caption);
          showPortfolioAlert(t('portfolio_save_success'));
          await loadPortfolioManager();
          return;
        } catch (error) {
          console.warn('Caption update via API failed, using local fallback:', error.message);
          portfolioMode = 'local';
          showPortfolioAlert(t('portfolio_api_fallback'), 'warning');
        }
      }

      const next = [...portfolioItems];
      next[index] = { ...next[index], caption };
      portfolioItems = setLocalPortfolio(next);
      renderPortfolioManager();
      showPortfolioAlert(t('portfolio_save_success'));
    }

    async function applyPortfolioReorder(nextItems) {
      const normalized = nextItems
        .map((item, idx) => ({ ...item, sort_order: idx }))
        .slice(0, PORTFOLIO_MAX);

      if (portfolioMode === 'api' && window.BH_API) {
        const ids = normalized.map((item) => Number.parseInt(item.id, 10));
        const validIds = ids.every((id) => Number.isInteger(id) && id > 0);
        if (validIds) {
          try {
            await window.BH_API.reorderMyPortfolio(ids);
            showPortfolioAlert(t('portfolio_reorder_success'));
            await loadPortfolioManager();
            return true;
          } catch (error) {
            console.warn('Reorder via API failed, using local fallback:', error.message);
            portfolioMode = 'local';
            showPortfolioAlert(t('portfolio_api_fallback'), 'warning');
          }
        } else {
          portfolioMode = 'local';
        }
      }

      portfolioItems = setLocalPortfolio(normalized);
      renderPortfolioManager();
      showPortfolioAlert(t('portfolio_reorder_success'));
      return true;
    }

    async function movePortfolioPhoto(index, direction) {
      const target = index + direction;
      if (target < 0 || target >= portfolioItems.length) return;

      const next = [...portfolioItems];
      const [moved] = next.splice(index, 1);
      next.splice(target, 0, moved);
      await applyPortfolioReorder(next);
    }

    async function deletePortfolioPhoto(index) {
      const item = portfolioItems[index];
      if (!item) return;
      if (!confirm(t('portfolio_delete_confirm'))) return;

      if (portfolioMode === 'api' && window.BH_API) {
        try {
          await window.BH_API.deleteMyPortfolioPhoto(item.id);
          showPortfolioAlert(t('portfolio_delete_success'));
          await loadPortfolioManager();
          return;
        } catch (error) {
          console.warn('Delete via API failed, using local fallback:', error.message);
          portfolioMode = 'local';
          showPortfolioAlert(t('portfolio_api_fallback'), 'warning');
        }
      }

      const next = portfolioItems.filter((_, idx) => idx !== index);
      portfolioItems = setLocalPortfolio(next);
      renderPortfolioManager();
      showPortfolioAlert(t('portfolio_delete_success'));
    }

    function isDataImageUri(value) {
      return /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/]+=*$/i.test(String(value || '').trim());
    }

    function isValidAvatarValue(value) {
      const raw = String(value || '').trim();
      if (!raw) return false;
      if (isDataImageUri(raw)) return true;
      try {
        const parsed = new URL(raw);
        if (parsed.protocol === 'https:') return true;
        if (parsed.protocol !== 'http:') return false;
        const host = parsed.hostname.toLowerCase();
        return host === 'localhost' || host === '127.0.0.1' || host === '::1';
      } catch (_) {
        return false;
      }
    }

    function persistLocalAvatar(avatarValue) {
      const value = typeof avatarValue === 'string' ? avatarValue.trim() : '';
      if (value) {
        localStorage.setItem('bh_avatar_' + barber.id, value);
      } else {
        localStorage.removeItem('bh_avatar_' + barber.id);
      }
      if (barber._dynamic) {
        const profiles = JSON.parse(localStorage.getItem('bh_barber_profiles') || '{}');
        if (profiles[barber.id]) {
          profiles[barber.id].avatar = value || null;
          localStorage.setItem('bh_barber_profiles', JSON.stringify(profiles));
        }
      }
      barber = { ...barber, avatar: value || null };
    }

    async function saveAvatar() {
      const url = document.getElementById('avatarUrlInput')?.value.trim();
      if (!url) {
        showProfileAlert('Please add an image URL or upload a photo.', 'error');
        return;
      }
      if (!isValidAvatarValue(url)) {
        showProfileAlert('Use a valid image URL or upload a JPG/PNG/WebP photo.', 'error');
        return;
      }

      let finalAvatar = url;
      let localOnly = false;
      if (window.BH_API) {
        try {
          const result = isDataImageUri(url)
            ? await window.BH_API.uploadMyAvatar(url)
            : await window.BH_API.updateMyAvatar(url);
          if (result && typeof result.avatar === 'string' && result.avatar.trim()) {
            finalAvatar = result.avatar.trim();
          }
        } catch (err) {
          console.warn('Avatar API save failed, using local fallback:', err.message);
          localOnly = true;
        }
      }

      persistLocalAvatar(finalAvatar);
      const input = document.getElementById('avatarUrlInput');
      if (input) input.value = finalAvatar;
      showProfileAlert(localOnly ? 'Photo saved on this device only.' : 'Photo saved!', localOnly ? 'warning' : 'success');
      setTimeout(render, 900);
    }

    async function removeAvatar() {
      let localOnly = false;
      if (window.BH_API) {
        try {
          await window.BH_API.removeMyAvatar();
        } catch (err) {
          console.warn('Avatar remove API failed, using local fallback:', err.message);
          localOnly = true;
        }
      }
      persistLocalAvatar('');
      showProfileAlert(localOnly ? 'Photo removed on this device only.' : 'Photo removed.', localOnly ? 'warning' : 'success');
      render();
    }

    function handleAvatarUpload(input) {
      const file = input.files && input.files[0];
      input.value = '';
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showProfileAlert('Please select an image file.', 'error');
        return;
      }
      if (file.size > 8 * 1024 * 1024) {
        showProfileAlert('Photo must be under 8 MB.', 'error');
        return;
      }

      showProfileAlert('Processing photo...', 'info');
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = async () => {
          const SIZE = 480;
          const side = Math.min(img.width, img.height);
          const sx = Math.floor((img.width - side) / 2);
          const sy = Math.floor((img.height - side) / 2);
          const canvas = document.createElement('canvas');
          canvas.width = SIZE;
          canvas.height = SIZE;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, sx, sy, side, side, 0, 0, SIZE, SIZE);

          let dataUri = canvas.toDataURL('image/jpeg', 0.8);
          if (dataUri.length > 800000) dataUri = canvas.toDataURL('image/jpeg', 0.65);

          const urlInput = document.getElementById('avatarUrlInput');
          if (urlInput) urlInput.value = dataUri;
          await saveAvatar();
        };
        img.onerror = () => showProfileAlert('Could not read image. Try a different photo.', 'error');
        img.src = event.target.result;
      };
      reader.onerror = () => showProfileAlert('Could not read file. Try again.', 'error');
      reader.readAsDataURL(file);
    }

    function saveShopInfo() {
      if (!barber._dynamic) return;
      const profiles = JSON.parse(localStorage.getItem('bh_barber_profiles') || '{}');
      if (!profiles[barber.id]) return;
      profiles[barber.id].shop_name         = document.getElementById('pShopName')?.value.trim() || barber.shop_name;
      profiles[barber.id].bio               = document.getElementById('pBio')?.value.trim()      || '';
      profiles[barber.id].city              = document.getElementById('pCity')?.value.trim()      || barber.city;
      profiles[barber.id].location          = document.getElementById('pLocation')?.value.trim()  || barber.city;
      profiles[barber.id].years_experience  = parseInt(document.getElementById('pExp')?.value)    || 0;
      profiles[barber.id].cancellation_hours= parseInt(document.getElementById('pCancel')?.value) || 24;
      localStorage.setItem('bh_barber_profiles', JSON.stringify(profiles));
      // Refresh local barber object
      barber = getDynamicBarber(barber.id);
      showProfileAlert('Shop info saved! Customers can now see your updated profile.');
      setTimeout(render, 1800);
    }

    function showProfileAlert(msg, type = 'success') {
      const el = document.getElementById('bdashProfileAlert');
      const cls = type === 'error'
        ? 'alert-danger'
        : (type === 'warning' ? 'alert-warning' : (type === 'info' ? 'alert-info' : 'alert-success'));
      if (el) el.innerHTML = `<div class="alert ${cls}">${msg}</div>`;
      setTimeout(() => { const e = document.getElementById('bdashProfileAlert'); if(e) e.innerHTML=''; }, 2500);
    }

    function updateStatus(id, status) {
      Bookings.update(id, { status });
      const booking = Bookings.getAll().find(b => b.id === id);
      if (booking) {
        const msgs = {
          confirmed: `Your appointment on ${booking.date} at ${booking.time} has been confirmed!`,
          cancelled: `Your appointment on ${booking.date} at ${booking.time} was declined by the barber.`,
          completed: `Your appointment on ${booking.date} at ${booking.time} is now marked complete.`
        };
        Notifs.add(booking.customer_id, {
          title: status.charAt(0).toUpperCase() + status.slice(1),
          message: msgs[status] || '',
          type: 'booking'
        });
      }
      render();
    }

    function onSvcImagePick(input) {
      const file = input.files[0];
      if (!file) return;
      if (file.size > 1.5 * 1024 * 1024) { alert('Image must be under 1.5 MB.'); input.value = ''; return; }
      const reader = new FileReader();
      reader.onload = (e) => {
        _svcImageDataUri = e.target.result;
        document.getElementById('svcImgPreview').src = _svcImageDataUri;
        document.getElementById('svcImgPreviewWrap').style.display = '';
        document.getElementById('svcImgName').textContent = file.name;
      };
      reader.readAsDataURL(file);
    }

    function openSvcModal(id) {
      editingSvcId = id;
      _svcImageDataUri = null;
      const services = getServices();
      const s = id ? services.find(x => x.id === id) : null;
      document.getElementById('svcModalTitle').textContent = s ? t('svc_modal_edit') : t('svc_modal_add');
      document.getElementById('svcName').value  = s ? s.name  : '';
      document.getElementById('svcDesc').value  = s ? (s.desc||'') : '';
      document.getElementById('svcPrice').value = s ? s.price : '';
      document.getElementById('svcDur').value   = s ? s.duration : '';
      document.getElementById('svcImgFile').value = '';
      document.getElementById('svcImgName').textContent = '';
      document.getElementById('svcModalError').style.display = 'none';
      const preview = document.getElementById('svcImgPreview');
      const previewWrap = document.getElementById('svcImgPreviewWrap');
      if (s && s.image_url) {
        preview.src = s.image_url;
        previewWrap.style.display = '';
      } else {
        preview.src = '';
        previewWrap.style.display = 'none';
      }
      document.getElementById('svcModal').classList.add('open');
    }
    function closeSvcModal() {
      document.getElementById('svcModal').classList.remove('open');
      editingSvcId = null;
      _svcImageDataUri = null;
    }
    async function saveService() {
      const name  = document.getElementById('svcName').value.trim();
      const desc  = document.getElementById('svcDesc').value.trim();
      const price = parseFloat(document.getElementById('svcPrice').value);
      const dur   = parseInt(document.getElementById('svcDur').value);
      const errEl = document.getElementById('svcModalError');
      errEl.style.display = 'none';

      if (!name || isNaN(price) || isNaN(dur)) {
        errEl.textContent = 'Please fill all required fields.';
        errEl.style.display = '';
        return;
      }

      const btn = document.getElementById('svcSaveBtn');
      btn.disabled = true;
      btn.textContent = 'Saving…';

      try {
        let saved;
        const priceInCents = Math.round(price * 100);
        if (editingSvcId) {
          saved = await BH_API.updateService(editingSvcId, { name, desc, price: priceInCents, duration: dur });
        } else {
          saved = await BH_API.createService({ name, desc, price: priceInCents, duration: dur });
        }

        // Upload image if one was picked
        if (_svcImageDataUri && saved && saved.id) {
          btn.textContent = 'Uploading image…';
          try {
            saved = await BH_API.uploadServiceImage(saved.id, _svcImageDataUri);
          } catch (_) { /* image upload failure is non-fatal */ }
        }

        await loadServicesFromAPI();
        closeSvcModal();
      } catch (err) {
        errEl.textContent = err.message || 'Failed to save service.';
        errEl.style.display = '';
      } finally {
        btn.disabled = false;
        btn.textContent = t('btn_save');
      }
    }
    async function deleteService(id) {
      if (!confirm('Delete this service?')) return;
      try {
        await BH_API.deleteService(id);
        await loadServicesFromAPI();
      } catch (err) {
        alert(err.message || 'Failed to delete service.');
      }
    }

    function exportConfirmedCalendar() {
      const now = new Date();
      const events = Bookings.getForBarber(barber.id)
        .filter(b => b.status === 'confirmed' || b.status === 'pending')
        .filter(b => new Date(`${b.date}T${b.time}:00`) >= now)
        .sort((a, b) => new Date(`${a.date}T${a.time}:00`) - new Date(`${b.date}T${b.time}:00`))
        .map(b => getBookingCalendarEvent(b, barber));

      if (!events.length) {
        alert('No upcoming bookings to export.');
        return;
      }
      downloadICS(`jotma-${barber.id}-calendar.ics`, events);
    }

    function syncNextBookingToGoogle() {
      const next = Bookings.getForBarber(barber.id)
        .filter(b => b.status === 'confirmed' || b.status === 'pending')
        .filter(b => new Date(`${b.date}T${b.time}:00`) >= new Date())
        .sort((a, b) => new Date(`${a.date}T${a.time}:00`) - new Date(`${b.date}T${b.time}:00`))[0];
      if (!next) {
        alert('No upcoming booking to sync.');
        return;
      }
      openBookingInGoogleCalendar(next, barber);
    }

    function toggleDay(day, open) {
      const sched = getSchedule();
      const idx = sched.findIndex(a => a.day === day);
      if (idx !== -1) sched[idx].open = open;
      saveSchedule(sched);
      render();
    }
    function updateHours(day, field, val) {
      const sched = getSchedule();
      const idx = sched.findIndex(a => a.day === day);
      if (idx !== -1) sched[idx][field] = val;
      saveSchedule(sched);
    }
    function saveScheduleBtn() {
      const prefs = {
        buffer_before: parseInt(document.getElementById('prefBufferBefore')?.value, 10) || 0,
        buffer_after: parseInt(document.getElementById('prefBufferAfter')?.value, 10) || 0,
        travel_buffer: parseInt(document.getElementById('prefTravelBuffer')?.value, 10) || 0,
        lunch_enabled: !!document.getElementById('prefLunchEnabled')?.checked,
        lunch_start: document.getElementById('prefLunchStart')?.value || '13:00',
        lunch_end: document.getElementById('prefLunchEnd')?.value || '14:00'
      };
      if (prefs.lunch_enabled && prefs.lunch_start >= prefs.lunch_end) {
        alert('Lunch end time must be after lunch start time.');
        return;
      }
      setBarberCalendarPrefs(barber.id, prefs);
      document.getElementById('scheduleAlert').innerHTML = `<div class="alert alert-success">${t('bdash_schedule_saved')}</div>`;
      setTimeout(() => { document.getElementById('scheduleAlert').innerHTML = ''; }, 3000);
    }

    document.getElementById('svcModal').addEventListener('click', function(e) {
      if (e.target === this) closeSvcModal();
    });

    render();
  </script>
