  <style>
    .hero {
      position: relative;
      min-height: auto;
      display: flex;
      align-items: center;
      overflow: hidden;
      background: linear-gradient(160deg, #06060f 0%, #0c0c1f 40%, #12122a 70%, #0d0d20 100%);
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 70% at 50% -10%, rgba(233, 69, 96, 0.18) 0%, transparent 65%),
        radial-gradient(ellipse 60% 50% at 80% 110%, rgba(99, 102, 241, 0.1) 0%, transparent 55%),
        radial-gradient(ellipse 40% 40% at 10% 80%, rgba(233, 69, 96, 0.06) 0%, transparent 60%);
      pointer-events: none;
    }

    /* Subtle grid overlay for depth */
    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .hero__content {
      position: relative;
      z-index: 1;
      max-width: 720px;
      padding: 0.75rem 0 1.1rem;
    }

    .hero__tag {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(233, 69, 96, 0.1);
      color: var(--primary);
      border: 1px solid rgba(233, 69, 96, 0.25);
      border-radius: 50px;
      padding: 0.3rem 1rem;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 1.4rem;
      letter-spacing: 0.03em;
    }

    .hero__title {
      /* Keep semantic h1 but present with h2-like visual scale */
      font-size: clamp(1.85rem, 4.6vw, 2.7rem);
      font-weight: 780;
      line-height: 1.16;
      margin-bottom: 0.65rem;
    }

    .hero__accent {
      background: linear-gradient(135deg, var(--primary) 0%, #ff8fa3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero__sub {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin: 0.95rem 0 1.05rem;
      max-width: 500px;
      line-height: 1.7;
    }

    .hero__search {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.5rem;
      margin-bottom: 0.25rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      max-width: 680px;
      position: relative;
      overflow: visible;
    }

    .hero__search-wrap { position: relative; }

    .hero__search-row {
      display: flex;
      gap: 0;
    }

    .hero__suggestions {
      top: calc(100% + 6px);
      z-index: 550;
    }

    .hero__field {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 1;
      padding: 0 0.75rem;
      border-right: 1px solid var(--border);
    }

    .hero__field:last-of-type { border-right: none; }

    .hero__field input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 0.9rem;
      padding: 0.7rem 0;
      font-family: inherit;
    }

    .hero__field input::placeholder { color: var(--text-muted); }
    .hero__search .btn { border-radius: 10px; flex-shrink: 0; }

    .quick-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      padding: 0.35rem 0.5rem 0;
    }

    .quick-tag {
      background: var(--bg-elevated);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 0.2rem 0.6rem;
      font-size: 0.7rem;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .quick-tag:hover { border-color: var(--primary); color: var(--primary); }

    .hero__stats {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .hero__stat { display: flex; flex-direction: column; }
    .hero__stat strong { font-size: 1.35rem; font-weight: 800; }
    .hero__stat span { font-size: 0.78rem; color: var(--text-muted); }
    .hero__stat-div { width: 1px; height: 36px; background: var(--border); }

    .hiw { background: var(--bg-card); }
    .hiw-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }

    .hiw-step {

      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      text-align: center;

    .hiw-icon { font-size: 2.2rem; margin-bottom: 0.5rem; }

    .hiw-num {
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    .hiw-step h3 { margin-bottom: 0.4rem; font-size: 1rem; }
    .hiw-step p { color: var(--text-muted); font-size: 0.85rem; }

    .cta-box {
      background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-surface) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 2rem;

    .cta-box__text h2 { font-size: 1.85rem; font-weight: 800; margin-bottom: 0.75rem; }

    .cta-box__text p {
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      max-width: 420px;
      line-height: 1.7;
    }

    .cta-box__btns { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .cta-box__icon { font-size: 4rem; opacity: 0.2; }

    .local-city-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.4rem;
    }

    .local-city-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.5rem 0.65rem;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, transform 0.2s;
    }

    .local-city-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      text-decoration: none;
    }

    .local-city-card strong { display: block; margin-bottom: 0; font-size: 0.82rem; }
    .local-city-card span { color: var(--text-muted); font-size: 0.72rem; }

    .hero__field input { font-size: 1rem; }

    @media (max-width: 768px) {
      .hero { min-height: auto; }
      .hero__content { padding: 1.35rem 0 1.6rem; }
      .hero__title { font-size: clamp(1.6rem, 7vw, 2.25rem); }
      .hero__sub { font-size: 0.95rem; max-width: 100%; }
      /* Search bar: stack fields vertically, full width */
      .hero__search { max-width: 100%; }
      .hero__search-row { flex-direction: column; }
      .hero__field { border-right: none; border-bottom: 1px solid var(--border); padding: 0.65rem 0.75rem; max-width: 100% !important; min-height: 52px; }
      .hero__field:last-of-type { border-bottom: none; }
      .hero__search .btn { width: 100%; border-radius: 8px; padding: 0.9rem; margin-top: 0.25rem; min-height: 52px; font-size: 1rem; }
      /* Quick-tag filters: larger touch targets, span full row */
      .quick-tags { padding: 0.5rem 0.5rem 0; gap: 0.5rem; }
      .quick-tag { flex: 1 1 auto; text-align: center; min-height: 44px; padding: 0.55rem 0.75rem; }
      .hero__stats { gap: 1rem; flex-wrap: wrap; }
      .hero__stat-div { display: none; }
      .hero__stat { min-width: 92px; }
      .hiw-steps { grid-template-columns: 1fr; }
      .cta-box { flex-direction: column; padding: 1.75rem; }
      .cta-box__btns { flex-direction: column; }
      .cta-box__btns .btn { width: 100%; }
      .cta-box__icon { display: none; }
      .cta-box__text h2 { font-size: 1.4rem; }
      .local-city-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 480px) {
      .hero__content { padding: 1.05rem 0; }
      .hero__stats { gap: 0.75rem; }
      .hero__stat strong { font-size: 1.1rem; }
      .local-city-grid { grid-template-columns: repeat(2, 1fr); }
      /* City cards touch-friendly */
      .local-city-card { padding: 0.85rem; min-height: 60px; }
    }

    /* ===== Circular Barber Scroll ===== */
    .barber-scroll-row {
      display: flex;
      gap: 1.25rem;
      overflow-x: auto;
      padding: 0.5rem 0.25rem 1.25rem;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .barber-scroll-row::-webkit-scrollbar { display: none; }

    .barber-circle-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      flex-shrink: 0;
      width: 88px;
    }
    .barber-circle-avatar {
      width: 82px; height: 82px;
      border-radius: 50%;
      border: 3px solid var(--primary);
      overflow: hidden;
      background: var(--bg-card);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; font-weight: 800; color: white;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }
    .barber-circle-item:hover .barber-circle-avatar,
    .barber-circle-item:active .barber-circle-avatar {
      transform: scale(1.06);
      box-shadow: 0 0 0 5px rgba(233,69,96,0.25);
    }
    .barber-circle-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .barber-circle-verified {
      position: absolute; bottom: 3px; right: 3px;
      width: 18px; height: 18px;
      background: var(--primary); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem; color: white;
      border: 2px solid var(--bg);
    }
    .barber-circle-name {
      font-size: 0.78rem; font-weight: 600;
      text-align: center; max-width: 88px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--text);
    }
    .barber-circle-sub {
      font-size: 0.69rem; color: var(--text-muted); text-align: center;
    }
    .barber-circle-price { color: var(--primary); font-weight: 600; }

    /* ===== Profile Sheet ===== */
    .profile-sheet-overlay {
      position: fixed; inset: 0; z-index: 900;
      background: rgba(0,0,0,0.65);
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
      display: flex; align-items: flex-end;
    }
    .profile-sheet-overlay.open { opacity: 1; pointer-events: all; }
    .profile-sheet-panel {
      width: 100%; max-height: 94vh;
      background: var(--bg);
      border-radius: 1.5rem 1.5rem 0 0;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      overscroll-behavior: contain;
    }
    .profile-sheet-overlay.open .profile-sheet-panel { transform: translateY(0); }

    .profile-sheet-topbar {
      position: sticky; top: 0; z-index: 10;
      background: var(--bg);
      padding: 0.6rem 1.25rem 0.6rem;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .profile-sheet-drag {
      width: 40px; height: 5px;
      background: var(--border); border-radius: 3px;
      position: absolute; left: 50%; top: 0.55rem; transform: translateX(-50%);
    }
    .sheet-profile-hero {
      background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-surface) 100%);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 1.25rem 1rem;
    }
    .sheet-profile-header { display: flex; gap: 1rem; align-items: flex-start; }
    .sheet-profile-ava {
      width: 78px; height: 78px; flex-shrink: 0;
      border-radius: 50%; border: 3px solid var(--primary);
      background: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.7rem; font-weight: 800; color: white; overflow: hidden;
    }
    .sheet-profile-ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .sheet-profile-name {
      font-size: 1.1rem; font-weight: 800;
      display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap;
      margin-bottom: 0.2rem;
    }
    .sheet-profile-meta {
      display: flex; flex-wrap: wrap; gap: 0.4rem;
      font-size: 0.78rem; color: var(--text-muted); margin: 0.3rem 0;

    .sheet-cta {
      padding: 0.85rem 1.25rem;
      display: flex; gap: 0.6rem; flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }
    .sheet-cta .btn { flex: 1; min-width: 110px; }
    .sheet-tabs { padding: 0 1.25rem; }
    .sheet-tab-content { padding: 1rem 1.25rem 5rem; }
    .sheet-svc-list { display: flex; flex-direction: column; gap: 0.65rem; }
    .sheet-svc-item {
      padding: 0.9rem 1rem;
      display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .sheet-svc-item h4 { margin-bottom: 0.1rem; font-size: 0.88rem; }
    .sheet-svc-item p { color: var(--text-muted); font-size: 0.76rem; }
    .sheet-svc-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.35rem; flex-shrink: 0; }
    .sheet-svc-price { font-size: 1.05rem; font-weight: 800; color: var(--primary); }
    .sheet-portfolio-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 0.55rem; }
    .sheet-review-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 0.9rem;
    }
    .sheet-review-head { display: flex; align-items: center; gap: 0.55rem; margin-bottom: 0.45rem; }
    .sheet-review-ava {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--bg-elevated);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: var(--primary); font-size: 0.8rem; flex-shrink: 0;
    }
    .sheet-reviews-summary {
      display: grid; grid-template-columns: auto 1fr; gap: 1.25rem;
      align-items: center; margin-bottom: 1.1rem;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1rem;
    }
    .sheet-avail-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.65rem 0.9rem; border-bottom: 1px solid var(--border); font-size: 0.84rem;

    .sheet-avail-row:last-child { border-bottom: none; }
    .sheet-avail-row.closed { opacity: 0.5; }

    @media (max-width: 480px) {
      .sheet-portfolio-grid { grid-template-columns: repeat(2,1fr); }
      .sheet-reviews-summary { grid-template-columns: 1fr; gap: 0.75rem; }
      .sheet-svc-item { flex-direction: column; align-items: flex-start; }
      .sheet-svc-right { width: 100%; align-items: flex-start; flex-direction: row; justify-content: space-between; }

    /* ===== Modern Booking Layout (same design system) ===== */

    }

    }

    }

      margin: 0 0 0.38rem;

  <script>
    window.__currentNavPage = 'index';
    renderNav('index');
    renderFooter();
    applyI18n();
    if (typeof Analytics !== 'undefined') Analytics.track('homepage_view');

    // Search
    const DEFAULT_SERVICE_SUGGESTIONS = [
      'Baby Ear Piercing',
      'Ear Waxing',
      'Ear Piercing',
      'Ear Cleaning',
      'Ear Candling',
      'Barber',
      'Barber Fade'
    ];

    const HOME_CATEGORIES = [
      { nameKey: 'cat_barbers',     query: 'Barber',   image: 'https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=280&h=280&fit=crop' },
      { nameKey: 'cat_hair_salon',  query: 'Haircut',  image: 'https://images.unsplash.com/photo-1487412912498-0447578fcca8?w=280&h=280&fit=crop' },
      { nameKey: 'cat_nails',       query: 'Nails',    image: 'https://images.unsplash.com/photo-1607779097040-26e80aa78e66?w=280&h=280&fit=crop' },
      { nameKey: 'cat_brows_lashes',query: 'Brows',    image: 'https://images.unsplash.com/photo-1512496015851-a90fb38ba796?w=280&h=280&fit=crop' },
      { nameKey: 'cat_piercing',    query: 'Piercing', image: 'https://images.unsplash.com/photo-1560750588-73207b1ef5b8?w=280&h=280&fit=crop' },
      { nameKey: 'cat_massage',     query: 'Massage',  image: 'https://images.unsplash.com/photo-1544161515-4ab6ce6db874?w=280&h=280&fit=crop' }
    ];

    let _heroSearchIndex = { services: [], businesses: [] };
    let _heroCurrentSuggestions = [];
    let _activeCityFilter = '';

    function _heroEsc(str) {
      if (typeof escapeHTML === 'function') return escapeHTML(str);
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function _normalizeSearch(value) {
      return String(value || '').toLowerCase().trim();
    }

    function _matchScore(value, query) {
      const text = _normalizeSearch(value);
      if (!text || !query) return -1;
      if (text === query) return 0;
      if (text.startsWith(query)) return 1;
      const idx = text.indexOf(query);
      if (idx >= 0) return 2 + (idx / 1000);
      return -1;
    }

    function _heroHighlight(name, query) {
      const text = String(name || '');
      const q = String(query || '').trim();
      if (!q) return _heroEsc(text);
      const lower = text.toLowerCase();
      const i = lower.indexOf(q.toLowerCase());
      if (i < 0) return _heroEsc(text);
      const start = text.slice(0, i);
      const match = text.slice(i, i + q.length);
      const end = text.slice(i + q.length);
      return `${_heroEsc(start)}<span class="navbar__sugg-match">${_heroEsc(match)}</span><span class="navbar__sugg-rest">${_heroEsc(end)}</span>`;
    }

    function _refreshSearchIndex(barbers) {
      const serviceMap = new Map();
      const businessMap = new Map();

      for (const serviceName of DEFAULT_SERVICE_SUGGESTIONS) {
        const key = _normalizeSearch(serviceName);
        if (!serviceMap.has(key)) {
          serviceMap.set(key, { name: serviceName });
        }
      }

      for (const b of barbers) {
        const services = getBarberServices(b);
        for (const service of services) {
          const name = String(service?.name || '').trim();
          if (!name) continue;
          const key = _normalizeSearch(name);
          if (!serviceMap.has(key)) {
            serviceMap.set(key, { name });
          }
        }

        const name = String(b.shop_name || `${b.first_name || ''} ${b.last_name || ''}`).trim();
        if (!name) continue;
        const key = _normalizeSearch(name);
        if (!businessMap.has(key)) {
          businessMap.set(key, {
            id: b.id,
            name,
            city: String(b.city || '').trim(),
            address: String(b.location || b.city || '').trim()
          });
        }
      }

      _heroSearchIndex = {
        services: Array.from(serviceMap.values()).sort((a, b) => a.name.localeCompare(b.name)),
        businesses: Array.from(businessMap.values()).sort((a, b) => a.name.localeCompare(b.name))
      };
    }

    function heroHideSuggestions() {
      const box = document.getElementById('heroSuggestions');
      if (box) box.style.display = 'none';
      _heroCurrentSuggestions = [];
    }

    function heroPickSuggestion(index) {
      const item = _heroCurrentSuggestions[index];
      if (!item) return;
      const input = document.getElementById('searchInput');
      if (input) input.value = item.name || '';
      heroHideSuggestions();
      if (item.type === 'business' && item.city) {
        _activeCityFilter = item.city;
        _syncCityButtonsUI();
        renderHomeSections();
      }
    }

    function heroSearchSuggest(value) {
      const box = document.getElementById('heroSuggestions');
      if (!box) return;
      const queryRaw = String(value || '').trim();
      const query = _normalizeSearch(queryRaw);
      if (!query) {
        heroHideSuggestions();
        return;
      }

      const services = _heroSearchIndex.services
        .map((item) => ({ ...item, score: _matchScore(item.name, query) }))
        .filter((item) => item.score >= 0)
        .sort((a, b) => (a.score - b.score) || a.name.localeCompare(b.name))
        .slice(0, 6);

      const businesses = _heroSearchIndex.businesses
        .map((item) => {
          const scores = [
            _matchScore(item.name, query),
            _matchScore(item.city, query),
            _matchScore(item.address, query)
          ].filter((score) => score >= 0);
          return { ...item, score: scores.length ? Math.min(...scores) : -1 };
        })
        .filter((item) => item.score >= 0)
        .sort((a, b) => (a.score - b.score) || a.name.localeCompare(b.name))
        .slice(0, 6);

      if (!services.length && !businesses.length) {
        const message = typeof tf === 'function'
          ? tf('nav_no_results_for', { query: `<strong>${_heroEsc(queryRaw)}</strong>` })
          : `No results for <strong>${_heroEsc(queryRaw)}</strong>`;
        box.innerHTML = `<div class="navbar__sugg-empty">${message}</div>`;
        box.style.display = 'block';
        _heroCurrentSuggestions = [];
        return;
      }

      const serviceLabel = typeof t === 'function' ? t('search_services_group') : 'Services';
      const businessLabel = typeof t === 'function' ? t('search_businesses_group') : 'Businesses';

      _heroCurrentSuggestions = [];
      let html = '';

      if (services.length) {
        html += `<div class="navbar__sugg-group">&#128269; ${_heroEsc(serviceLabel)}</div>`;
        for (const item of services) {
          const idx = _heroCurrentSuggestions.push({ type: 'service', name: item.name, city: '' }) - 1;
          html += `<div class="navbar__sugg-item" onclick="heroPickSuggestion(${idx})"><span>&#128269;</span>${_heroHighlight(item.name, queryRaw)}</div>`;
        }
      }

      if (businesses.length) {
        html += `<div class="navbar__sugg-group">&#128205; ${_heroEsc(businessLabel)}</div>`;
        for (const item of businesses) {

    function heroSearchKeydown(e) {
      const box = document.getElementById('heroSuggestions');
      const items = box ? Array.from(box.querySelectorAll('.navbar__sugg-item')) : [];
      if (!box || box.style.display === 'none' || !items.length) {
        if (e.key === 'Enter') {
          e.preventDefault();
          doSearch();
        }
        return;
      }

      const focusedIndex = items.findIndex((el) => el.classList.contains('nav-focused'));

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (focusedIndex >= 0) items[focusedIndex].classList.remove('nav-focused');
        const next = items[(focusedIndex + 1) % items.length];
        next.classList.add('nav-focused');
        next.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (focusedIndex >= 0) items[focusedIndex].classList.remove('nav-focused');
        const prev = items[(focusedIndex - 1 + items.length) % items.length];
        prev.classList.add('nav-focused');
        prev.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') {
        e.preventDefault();
        const target = focusedIndex >= 0 ? items[focusedIndex] : items[0];
        target.click();
      } else if (e.key === 'Escape') {
        heroHideSuggestions();
      }
    }

      }, 0);
      if (max > 0) return Math.min(50, Math.max(5, Math.round(max)));
      return 15;

      return services.some(svc => {

    function renderRecommendedList(barbers) {
      const list = document.getElementById('recommendedList');
      if (!list) return;
      if (!barbers.length) {
        list.innerHTML = `<div class="text-muted text-sm">${typeof t === 'function' ? t('home_no_businesses') : 'No businesses available.'}</div>`;
        return;
      }

      const user = Auth.getUser();
      const userCity = String(user?.city || '').toLowerCase().trim();
      const recommended = [...barbers]
        .sort((a, b) => {
          const cityMatchA = userCity && String(a.city || '').toLowerCase() === userCity ? 1 : 0;
          const cityMatchB = userCity && String(b.city || '').toLowerCase() === userCity ? 1 : 0;
          if (cityMatchA !== cityMatchB) return cityMatchB - cityMatchA;
          const ratingDiff = (Number(b.rating) || 0) - (Number(a.rating) || 0);
          if (ratingDiff !== 0) return ratingDiff;
          return (Number(b.total_bookings) || 0) - (Number(a.total_bookings) || 0);
        })
        .slice(0, 10);

      list.innerHTML = recommended.map((barber) => {
        const name = _heroEsc(_barberDisplayName(barber));

      return cityValue === cityNeedle || locationValue.includes(cityNeedle);

      } else if (tab === 'reviews') {
        const userReviews = Reviews.get(barber.id);
        const allReviews = [...reviewsBase, ...userReviews];
        const avg = allReviews.reduce((s, r) => s + r.rating, 0) / (allReviews.length || 1);
        const counts = [5, 4, 3, 2, 1].map((n) => ({ n, cnt: allReviews.filter((r) => r.rating === n).length }));
        const reviewHTML = allReviews.map((r) => {
          const replyKey = `bh_reply_${barber.id}_${r.id}`;
          const replyText = localStorage.getItem(replyKey) || r.reply || null;
          return `
            <div class="sheet-review-card">
              <div class="sheet-review-head">
                <div class="sheet-review-ava">${escapeHTML(r.name[0])}</div>
                <div>
                  <strong style="font-size:0.85rem">${escapeHTML(r.name)}</strong>
                  <div style="display:flex;align-items:center;gap:0.3rem">
                    ${starsHTML(r.rating, '0.76rem')}
                    <span class="text-muted text-sm">${r.date}</span>
                  </div>
                </div>
              </div>
              ${r.comment ? `<p style="color:var(--text-muted);font-size:0.83rem;line-height:1.55">${escapeHTML(r.comment)}</p>` : ''}
              ${replyText ? `<div class="review-reply"><strong>${escapeHTML(barber.first_name)} ${typeof t === 'function' ? t('sheet_replied').replace('{name}', '') : 'replied:'}</strong> ${escapeHTML(replyText)}</div>` : ''}
            </div>`;
        }).join('');
        const reviewsCountLabel = typeof tf === 'function' ? tf('sheet_reviews_plural', { count: allReviews.length }) : `${allReviews.length} reviews`;
        el.innerHTML = `
          <div class="fade-in">
            <div class="sheet-reviews-summary">
              <div style="text-align:center">
                <div style="font-size:2.8rem;font-weight:800;line-height:1;color:var(--primary)">${avg.toFixed(1)}</div>
                <div style="margin:0.3rem 0">${starsHTML(avg, '1rem')}</div>
                <p class="text-muted text-sm">${reviewsCountLabel}</p>
              </div>
              <div>
                ${counts.map(({ n, cnt }) => `
                  <div class="sheet-rating-bar-row">
                    <span style="min-width:14px;color:var(--text-muted)">${n}</span>
                    <div class="sheet-rating-bar-track"><div class="sheet-rating-bar-fill" style="width:${allReviews.length ? (cnt / allReviews.length * 100) : 0}%"></div></div>
                    <span style="font-size:0.7rem;color:var(--text-muted);min-width:16px">${cnt}</span>
                  </div>`).join('')}
              </div>
            </div>
            ${isCustomer ? `<button class="btn btn-outline btn-sm" style="margin-bottom:1rem" onclick="openSheetReviewModal()">${typeof t === 'function' ? t('write_review') : 'Write a Review'}</button>` : ''}
            <div style="display:flex;flex-direction:column;gap:0.6rem">
              ${reviewHTML || `<div class="empty-state"><p>${typeof t === 'function' ? t('no_reviews') : 'No reviews yet. Be the first!'}</p></div>`}
            </div>
          </div>`;

      } else if (tab === 'availability') {
        if (!availability.length) {
          el.innerHTML = `<div class="empty-state"><p>${typeof t === 'function' ? t('sheet_no_schedule') : 'Schedule not set.'}</p></div>`;
          return;
        }
        el.innerHTML = `
          <div class="card fade-in" style="overflow:hidden">
            ${availability.map((a) => `
              <div class="sheet-avail-row ${!a.open ? 'closed' : ''}">
                <span style="font-weight:500;min-width:100px">${a.label}</span>
                <span style="color:var(--text-muted)">${a.open ? `${a.start} - ${a.end}` : (typeof t === 'function' ? t('cal_legend_closed') : 'Closed')}</span>
              </div>`).join('')}
          </div>`;
      }
    }

    // Called from cat-chip buttons inside the sheet
    function filterSheetCat(cat, btn) {
      document.querySelectorAll('#sheetCatBar .cat-chip').forEach((c) => c.classList.remove('active'));
      btn.classList.add('active');
      const barber = _sheetBarber;
      const isCustomer = Auth.getUser() && Auth.getUser().role === 'customer';
      const list = cat === 'all' ? window._sheetServicesList : (window._sheetGrouped[cat] || []);
      document.getElementById('sheetSvcList').innerHTML = list.map((s) => `
        <div class="sheet-svc-item">
          <div>
            <h4>${escapeHTML(s.name)} <span style="font-size:0.68rem;background:var(--bg-elevated);padding:0.1rem 0.4rem;border-radius:50px;color:var(--text-muted)">${SHEET_CAT_ICONS[s.category] || ''} ${escapeHTML(s.category)}</span></h4>
            ${s.desc ? `<p>${escapeHTML(s.desc)}</p>` : ''}
            <span style="font-size:0.72rem;color:var(--text-muted)">${typeof t === 'function' ? t('sheet_time_label') : 'Time:'} ${fmtDur(s.duration)}</span>
          </div>
          <div class="sheet-svc-right">
            <span class="sheet-svc-price">${fmtPrice(s.price)}</span>
            ${isCustomer ? `<a href="book.html?barber=${barber.id}&service=${s.id}" class="btn btn-primary btn-sm">${typeof t === 'function' ? t('sheet_book_btn') : 'Book'}</a>` : ''}
          </div>
        </div>`).join('');
    }

    async function sheetToggleFav() {
      const user = Auth.getUser();
      if (!user) { window.location.href = 'login.html'; return; }
      const barber = _sheetBarber;
      try {
        if (window.BH_API) {
          if (Favorites.isFav(user.id, barber.id)) await window.BH_API.removeFavorite(barber.id);
          else await window.BH_API.addFavorite(barber.id);
        }
      } catch (err) { console.warn('Fav sync failed:', err.message); }
      Favorites.toggle(user.id, barber.id);
      renderSheetContent();
    }

    // Sheet Review Modal
    function openSheetReviewModal() {
      _sheetReviewRating = 5;
      sheetUpdateStars(5);
      document.getElementById('sheetReviewComment').value = '';
      document.getElementById('sheetReviewAlert').innerHTML = '';
      document.getElementById('sheetReviewModal').classList.add('open');
    }
    function closeSheetReviewModal() { document.getElementById('sheetReviewModal').classList.remove('open'); }
    function sheetUpdateStars(val) {
      document.querySelectorAll('#sheetStarPicker span').forEach((s) => {
        s.style.color = parseInt(s.dataset.v) <= val ? 'var(--gold)' : '#4a5568';
      });
    }
    document.getElementById('sheetStarPicker').addEventListener('click', (e) => {
      const s = e.target.closest('span');
      if (!s) return;
      _sheetReviewRating = parseInt(s.dataset.v);
      sheetUpdateStars(_sheetReviewRating);
    });
    document.getElementById('sheetReviewModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('sheetReviewModal')) closeSheetReviewModal();
    });
    async function submitSheetReview() {
      const user = Auth.getUser();
      if (!user) return;
      const barber = _sheetBarber;
      const comment = document.getElementById('sheetReviewComment').value.trim();
      try {
        if (window.BH_API) {
          await window.BH_API.addReview(barber.id, _sheetReviewRating, comment);
          const fresh = await loadApiBarberById(barber.id);
          if (fresh) _sheetBarber = fresh;
        } else {
          Reviews.add(barber.id, { id: 'u' + Date.now(), name: user.first_name + ' ' + (user.last_name || '')[0] + '.', rating: _sheetReviewRating, comment, date: new Date().toISOString().split('T')[0], reply: null });
        }
      } catch (err) {
        document.getElementById('sheetReviewAlert').innerHTML = `<div class="alert alert-danger">${err.message || 'Unable to submit review.'}</div>`;
        return;
      }
      closeSheetReviewModal();
      switchSheetTab('reviews', document.querySelectorAll('#profileSheetContent .tab-btn')[2]);
    }
    sheetUpdateStars(5);

    // Sheet Lightbox
    function openSheetLightbox(idx) {
      _sheetLbIndex = idx;
      updateSheetLightbox();
      document.getElementById('sheetLightbox').classList.add('open');
    }
    function closeSheetLightbox() { document.getElementById('sheetLightbox').classList.remove('open'); }
    function sheetLightboxBgClick(e) { if (e.target === document.getElementById('sheetLightbox')) closeSheetLightbox(); }
    function sheetLightboxNav(dir) {
      _sheetLbIndex = (_sheetLbIndex + dir + _sheetLbPhotos.length) % _sheetLbPhotos.length;
      updateSheetLightbox();
    }
    function updateSheetLightbox() {
      const p = _sheetLbPhotos[_sheetLbIndex];
      document.getElementById('sheetLightboxImg').src = p.url;
      document.getElementById('sheetLightboxCaption').textContent = p.caption || '';
      document.getElementById('sheetLightboxCounter').textContent = `${_sheetLbIndex + 1} / ${_sheetLbPhotos.length}`;
    }
    document.addEventListener('keydown', (e) => {
      if (document.getElementById('profileSheet').classList.contains('open')) {
        if (e.key === 'Escape') closeProfileSheet();
      }
      if (document.getElementById('sheetLightbox').classList.contains('open')) {
        if (e.key === 'Escape') closeSheetLightbox();
        if (e.key === 'ArrowLeft') sheetLightboxNav(-1);
        if (e.key === 'ArrowRight') sheetLightboxNav(1);
      }
    });
  </script>
</body>
</html>
