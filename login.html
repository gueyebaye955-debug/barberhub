<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login  BarberHub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'></text></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .auth-wrap { min-height: calc(100vh - 140px); display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .auth-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 2.5rem; width: 100%; max-width: 420px; }
    .auth-logo { text-align: center; margin-bottom: 1.75rem; }
    .auth-logo span { font-size: 2rem; }
    .auth-logo h1 { font-size: 1.5rem; margin: 0.25rem 0 0.25rem; }
    .auth-logo p { color: var(--text-muted); font-size: 0.875rem; }
    .divider { display: flex; align-items: center; gap: 0.75rem; margin: 1.25rem 0; color: var(--text-muted); font-size: 0.8rem; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .demo-btns { display: flex; flex-direction: column; gap: 0.5rem; }
    .demo-btn { display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 0.85rem; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: 0.82rem; font-family: inherit; color: var(--text); transition: border-color 0.2s; text-align: left; }
    .demo-btn:hover { border-color: var(--primary); }
    .demo-badge { font-size: 0.68rem; padding: 0.1rem 0.4rem; border-radius: 4px; font-weight: 700; margin-left: auto; }
    .badge-customer { background: rgba(59,130,246,0.2); color: #60a5fa; }
    .badge-barber   { background: rgba(233,69,96,0.2); color: var(--primary); }
    .badge-admin    { background: rgba(245,158,11,0.2); color: #f59e0b; }
    .auth-footer { text-align: center; margin-top: 1.25rem; font-size: 0.875rem; color: var(--text-muted); }
    .auth-footer a { color: var(--primary); text-decoration: none; }
  </style>
</head>
<body class="page-wrap">
  <nav class="navbar" id="navbar"></nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <span></span>
        <h1 data-i18n="login_title">Welcome back</h1>
        <p data-i18n="login_sub">Sign in to your BarberHub account</p>
      </div>

      <div id="alertBox"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" data-i18n="login_email">Email Address</label>
          <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="login_password">Password</label>
          <input type="password" class="form-control" id="password" placeholder="" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem" id="loginBtn" data-i18n="login_btn">Sign In</button>
      </form>

      <div class="auth-footer">
        <span data-i18n="login_no_account">Don't have an account?</span> <a href="signup.html" data-i18n="login_create">Create one </a>
      </div>
    </div>
  </div>

  <footer class="footer" id="footer"></footer>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/nav.js"></script>
  <script>
    renderNav('login');
    renderFooter();
    applyI18n();

    if (Auth.isLoggedIn()) {
      const user = Auth.getUser();
      const map = { customer: 'dashboard.html', barber: 'barber-dashboard.html', admin: 'admin.html' };
      window.location.href = map[user.role] || 'index.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.textContent = t('login_signing');

      let result;
      try {
        result = window.BH_API
          ? await window.BH_API.login(email, password)
          : await Auth.login(email, password);
      } catch (err) {
        result = { ok: false, error: err.message || 'Unable to sign in. Please try again.' };
      }

      if (!result || result.ok === false || !result.user) {
        document.getElementById('alertBox').innerHTML = `<div class="alert alert-danger">${result.error}</div>`;
        btn.disabled = false;
        btn.textContent = t('login_btn');
        return;
      }

      localStorage.setItem('bh_user', JSON.stringify(result.user));
      localStorage.setItem('bh_last_activity', Date.now().toString());

      const params = new URLSearchParams(location.search);
      const redirect = params.get('redirect');
      const map = { customer: 'dashboard.html', barber: 'barber-dashboard.html', admin: 'admin.html' };
      // Only allow safe relative redirects (no external URLs, no javascript:)
      if (redirect && /^[a-zA-Z0-9_\-]+\.html(\?[^#]*)?$/.test(decodeURIComponent(redirect))) {
        window.location.href = decodeURIComponent(redirect);
      } else {
        window.location.href = map[result.user.role] || 'index.html';
      }
    });
  </script>
</body>
</html>
