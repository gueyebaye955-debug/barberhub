<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login  JOTMA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'></text></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .auth-wrap { min-height: calc(100vh - 140px); display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .auth-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 2.5rem; width: 100%; max-width: 420px; }
    .auth-logo { text-align: center; margin-bottom: 1.75rem; }
    .auth-logo span { font-size: 2rem; }
    .auth-logo h1 { font-size: 1.5rem; margin: 0.25rem 0 0.25rem; }
    .auth-logo p { color: var(--text-muted); font-size: 0.875rem; }
    .divider { display: flex; align-items: center; gap: 0.75rem; margin: 1.25rem 0; color: var(--text-muted); font-size: 0.8rem; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .demo-btns { display: flex; flex-direction: column; gap: 0.5rem; }
    .demo-btn { display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 0.85rem; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: 0.82rem; font-family: inherit; color: var(--text); transition: border-color 0.2s; text-align: left; }
    .demo-btn:hover { border-color: var(--primary); }
    .demo-badge { font-size: 0.68rem; padding: 0.1rem 0.4rem; border-radius: 4px; font-weight: 700; margin-left: auto; }
    .badge-customer { background: rgba(59,130,246,0.2); color: #60a5fa; }
    .badge-barber   { background: rgba(233,69,96,0.2); color: var(--primary); }
    .badge-admin    { background: rgba(245,158,11,0.2); color: #f59e0b; }
    .auth-footer { text-align: center; margin-top: 1.25rem; font-size: 0.875rem; color: var(--text-muted); }
    .auth-footer a { color: var(--primary); text-decoration: none; }
  </style>
</head>
<body class="page-wrap">
  <nav class="navbar" id="navbar"></nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <span></span>
        <h1 data-i18n="login_title">Welcome back</h1>
        <p data-i18n="login_sub">Sign in to your JOTMA account</p>
      </div>

      <div id="alertBox"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" data-i18n="login_email">Email Address</label>
          <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="login_password">Password</label>
          <input type="password" class="form-control" id="password" placeholder="" required>
        </div>
        <div class="form-group" id="captchaLoginWrap" style="display:none">
          <div id="captchaLogin"></div>
          <p id="captchaLoginHint" style="margin-top:0.4rem;font-size:0.78rem;color:var(--text-muted)"></p>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem" id="loginBtn" data-i18n="login_btn">Sign In</button>
      </form>

      <div style="display:flex;align-items:center;gap:0.75rem;margin:1rem 0">
        <div style="flex:1;height:1px;background:var(--border)"></div>
        <span style="color:var(--text-muted);font-size:0.8rem">or</span>
        <div style="flex:1;height:1px;background:var(--border)"></div>
      </div>
      <a href="/api/auth/google" class="btn btn-ghost" style="width:100%;display:flex;align-items:center;justify-content:center;gap:0.6rem">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 6.294C4.672 4.167 6.656 3.58 9 3.58z"/></svg>
        Sign in with Google
      </a>

      <div class="auth-footer">
        <span data-i18n="login_no_account">Don't have an account?</span> <a href="signup.html" data-i18n="login_create">Create one </a>
      </div>
    </div>
  </div>

  <footer class="footer" id="footer"></footer>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/nav.js?v=17"></script>
  <script>
    renderNav('login');
    renderFooter();
    applyI18n();
    const STRICT_AUTH = (typeof isProductionRuntime === 'function')
      ? isProductionRuntime()
      : (location.protocol !== 'file:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1');
    let loginCaptchaToken = '';
    let loginCaptchaEnabled = false;

    function ensureTurnstileLoaded() {
      if (window.turnstile) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const existing = document.querySelector('script[data-turnstile="1"]');
        if (existing) {
          existing.addEventListener('load', () => resolve(), { once: true });
          existing.addEventListener('error', () => reject(new Error('Unable to load CAPTCHA script')), { once: true });
          return;
        }
        const script = document.createElement('script');
        script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
        script.async = true;
        script.defer = true;
        script.dataset.turnstile = '1';
        script.onload = () => resolve();
        script.onerror = () => reject(new Error('Unable to load CAPTCHA script'));
        document.head.appendChild(script);
      });
    }

    async function initLoginCaptcha() {
      if (!window.BH_API) return;
      try {
        const cfg = await window.BH_API.getCaptchaConfig();
        if (!cfg?.enabled || !cfg?.site_key) return;
        loginCaptchaEnabled = true;
        document.getElementById('captchaLoginWrap').style.display = 'block';
        await ensureTurnstileLoaded();
        window.turnstile.render('#captchaLogin', {
          sitekey: cfg.site_key,
          callback(token) {
            loginCaptchaToken = token || '';
            const hint = document.getElementById('captchaLoginHint');
            if (hint) hint.textContent = '';
          },
          'expired-callback'() {
            loginCaptchaToken = '';
            const hint = document.getElementById('captchaLoginHint');
            if (hint) hint.textContent = 'Please verify CAPTCHA again.';
          },
        });
      } catch (_) {}
    }

    function formatLoginError(rawMessage) {
      const msg = String(rawMessage || '').trim();
      const lower = msg.toLowerCase();
      if (/failed to fetch|networkerror|load failed|timeout|cors|network request failed/.test(lower)) {
        return 'We could not reach the server. Check your internet connection and try again.';
      }
      if (/invalid email or password|invalid credentials|unauthorized/.test(lower)) {
        return 'Incorrect email or password.';
      }
      return msg || 'Unable to sign in. Please try again.';
    }

    // Handle Google OAuth redirect (token comes back in URL params)
    (function handleOAuthRedirect() {
      const p = new URLSearchParams(location.search);
      const token = p.get('token');
      const userRaw = p.get('user');
      const error = p.get('error');
      if (error) {
        document.getElementById('alertBox').innerHTML = `<div class="alert alert-danger">Google sign-in failed. Please try again.</div>`;
        return;
      }
      if (token && userRaw) {
        try {
          const user = JSON.parse(decodeURIComponent(userRaw));
          if (window.BH_API) window.BH_API.setSession(token, user);
          else { localStorage.setItem('bh_token', token); localStorage.setItem('bh_user', JSON.stringify(user)); }
          const map = { customer: 'dashboard.html', barber: 'barber-dashboard.html', admin: 'admin.html' };
          window.location.replace(map[user.role] || 'index.html');
        } catch (_) {}
      }
    }());

    if (Auth.isLoggedIn()) {
      const user = Auth.getUser();
      const map = { customer: 'dashboard.html', barber: 'barber-dashboard.html', admin: 'admin.html' };
      window.location.href = map[user.role] || 'index.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.textContent = t('login_signing');

      let result;
      try {
        if (window.BH_API) {
          try {
            if (loginCaptchaEnabled && !loginCaptchaToken) {
              throw new Error('Please complete CAPTCHA verification.');
            }
            result = await window.BH_API.login(email, password, loginCaptchaToken);
          } catch (apiErr) {
            const msg = String(apiErr?.message || '');
            const isNetworkIssue = !apiErr?.status || /failed to fetch|networkerror|load failed|timeout/i.test(msg);
            if (!isNetworkIssue || STRICT_AUTH) throw apiErr;
            result = await Auth.login(email, password);
          }
        } else {
          if (STRICT_AUTH) throw new Error('Service temporarily unavailable. Please try again in a moment.');
          result = await Auth.login(email, password);
        }
      } catch (err) {
        result = { ok: false, error: err.message || 'Unable to sign in. Please try again.' };
      }

      if (!result || result.ok === false || !result.user) {
        document.getElementById('alertBox').innerHTML = `<div class="alert alert-danger">${formatLoginError(result?.error)}</div>`;
        btn.disabled = false;
        btn.textContent = t('login_btn');
        return;
      }

      localStorage.setItem('bh_user', JSON.stringify(result.user));
      localStorage.setItem('bh_last_activity', Date.now().toString());

      const params = new URLSearchParams(location.search);
      const redirect = params.get('redirect');
      const map = { customer: 'dashboard.html', barber: 'barber-dashboard.html', admin: 'admin.html' };
      // Only allow safe relative redirects (no external URLs, no javascript:)
      if (redirect && /^[a-zA-Z0-9_\-]+\.html(\?[^#]*)?$/.test(decodeURIComponent(redirect))) {
        window.location.href = decodeURIComponent(redirect);
      } else {
        window.location.href = map[result.user.role] || 'index.html';
      }
    });
    initLoginCaptcha();
  </script>
</body>
</html>
